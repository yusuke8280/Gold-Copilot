<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GOLD Copilot</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080c12">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#080c12;--surface:#0d1420;--surface2:#111a2a;--border:#1e2d44;
  --gold:#f0b429;--green:#00d97e;--red:#ff4d6a;--blue:#3d8bff;
  --text:#e8f0ff;--muted:#4a6080;
}
html,body{
  width:100%;height:100%;
  background:var(--bg);color:var(--text);
  font-family:'Space Mono',monospace;
  overflow:hidden;position:fixed;
}

/* ── HEADER ── */
.header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;height:54px;
  background:linear-gradient(180deg,rgba(8,12,18,0.98),rgba(8,12,18,0.85));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:8px;}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.brand-name{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--gold);}
.header-right{display:flex;align-items:center;gap:8px;}
.price-main{font-size:22px;font-weight:700;font-family:'Space Mono',monospace;text-align:right;}
.price-change{font-size:10px;font-family:'Space Mono',monospace;margin-top:1px;text-align:right;}
.positive{color:var(--green);}
.negative{color:var(--red);}
.mt5-badge{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,77,106,0.15);border:1px solid var(--red);
  border-radius:6px;padding:4px 8px;font-size:10px;color:var(--red);cursor:pointer;
}
.mt5-badge.connected{background:rgba(0,217,126,0.15);border-color:var(--green);color:var(--green);}
.mt5-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ── BALANCE BAR ── */
.balance-bar{
  position:fixed;top:54px;left:0;right:0;z-index:90;
  display:none;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:5px 14px;
  display:none;
  grid-template-columns:repeat(5,1fr);gap:4px;
}
.balance-bar.show{display:grid !important;}
.bal-item{display:flex;flex-direction:column;align-items:center;}
.bal-label{font-size:8px;color:var(--muted);letter-spacing:1px;}
.bal-value{font-size:12px;font-weight:700;margin-top:1px;}

/* ── TF BAR ── */
.tf-bar{
  position:fixed;left:0;right:0;z-index:90;
  display:flex;background:var(--surface);
  border-bottom:1px solid var(--border);
  top:54px;
  transition:top 0.2s;
}
.tf-bar.with-balance{top:88px;}
.tf-btn{
  flex:1;padding:8px 0;font-size:11px;font-weight:700;
  font-family:'Space Mono',monospace;letter-spacing:1px;
  background:none;border:none;color:var(--muted);cursor:pointer;
}
.tf-btn.active{color:var(--gold);border-bottom:2px solid var(--gold);}

/* ── CHART ── */
.chart-area{
  position:fixed;left:0;right:0;bottom:170px;
  top:88px;
  transition:top 0.2s;
  background:var(--bg);
}
.chart-area.with-balance{top:122px;}
canvas{display:block;width:100% !important;}

/* ── BOTTOM BAR ── */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;height:60px;
  background:var(--surface);border-top:1px solid var(--border);
}
.pnl-btn{
  padding:10px 14px;background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;
  font-family:'Space Mono',monospace;font-size:10px;
  color:var(--text);cursor:pointer;white-space:nowrap;
}
.analyze-btn{
  flex:1;padding:12px;
  background:linear-gradient(135deg,#c47a00,var(--gold));
  border:none;border-radius:10px;
  font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
  color:#000;cursor:pointer;letter-spacing:1px;
}

/* ── MODAL（共通）── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.75);z-index:500;
  align-items:flex-end;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal{
  width:100%;max-height:90vh;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 16px 40px;
}
.modal-handle{
  width:36px;height:4px;
  background:var(--border);border-radius:2px;
  margin:0 auto 16px;
}
.modal-title{
  font-size:12px;color:var(--gold);
  letter-spacing:3px;margin-bottom:16px;text-align:center;
}
.m-field{margin-bottom:12px;}
.m-field label{font-size:9px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:4px;}
.m-field input,.m-field select{
  width:100%;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;color:var(--text);
  font-family:'Space Mono',monospace;font-size:12px;outline:none;
}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.modal-close{
  width:100%;padding:12px;margin-top:8px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--muted);
  font-size:12px;cursor:pointer;font-family:'Space Mono',monospace;
}
.btn-green{
  flex:1;padding:12px;
  background:linear-gradient(135deg,#006622,var(--green));
  border:none;border-radius:10px;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  color:#000;cursor:pointer;
}
.btn-red{
  flex:1;padding:12px;
  background:rgba(255,77,106,0.15);border:1px solid var(--red);
  border-radius:10px;font-family:'Space Mono',monospace;
  font-size:11px;color:var(--red);cursor:pointer;
}
.status-msg{
  padding:10px 12px;border-radius:8px;
  font-size:11px;margin-bottom:12px;display:none;
}

/* ── AI MODAL（全画面）── */
.ai-overlay{
  display:none;position:fixed;inset:0;z-index:600;
  background:var(--bg);flex-direction:column;
}
.ai-overlay.show{display:flex;}
.ai-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.ai-header-title{font-size:13px;color:var(--gold);letter-spacing:2px;}
.ai-close-btn{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);
  font-size:13px;padding:8px 18px;cursor:pointer;
  font-family:'Space Mono',monospace;
}
.ai-body{
  flex:1;overflow-y:scroll;
  -webkit-overflow-scrolling:touch;
  padding:16px;
}
.ai-placeholder{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:200px;gap:12px;
}
.ai-placeholder-icon{font-size:40px;}
.ai-placeholder-text{font-size:11px;color:var(--muted);letter-spacing:2px;}

/* ── AI コンテンツ ── */
.signal-card{
  border-radius:12px;padding:16px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;
}
.signal-main{font-size:32px;font-weight:700;letter-spacing:2px;}
.signal-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.signal-strength{font-size:13px;padding:4px 12px;border-radius:20px;font-weight:700;}
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.ind-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px;
}
.ind-label{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.ind-value{font-size:26px;font-weight:700;}
.ind-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.lines-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:12px;
}
.lines-title{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:10px;}
.line-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;border-bottom:1px solid var(--border);
}
.line-item:last-child{border-bottom:none;}
.line-name{font-size:13px;color:var(--muted);}
.line-price{font-size:14px;font-weight:700;}
.line-type{font-size:10px;padding:2px 8px;border-radius:10px;}
.analysis-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:12px;
}
.analysis-head{font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:8px;}
.analysis-text{font-size:14px;line-height:1.9;color:#a0b8d0;}
.entry-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:12px;
}
/* ── ポジション詳細モーダル ── */
.pos-modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.75);z-index:500;
  align-items:flex-end;justify-content:center;
}
.pos-modal-overlay.show{display:flex;}
.pos-modal{
  width:100%;max-height:85vh;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 16px 40px;
}
.pos-item{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:12px;
}
.pos-item-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.pos-item-symbol{font-size:16px;font-weight:700;}
.pos-item-pnl{font-size:20px;font-weight:700;}
.pos-item-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.pos-item-cell{background:var(--bg);border-radius:8px;padding:10px;}
.pos-item-label{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;}
.pos-item-value{font-size:14px;font-weight:700;}
.tp-cell{border:1px solid var(--green);}
.sl-cell{border:1px solid var(--red);}
.pos-chart-btn{
  width:100%;padding:12px;
  background:linear-gradient(135deg,#003399,#1a6aff);
  border:none;border-radius:10px;
  font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
  color:#fff;cursor:pointer;margin-bottom:8px;
}
.advice-box{
  border-radius:10px;padding:12px;margin-bottom:12px;
  font-size:13px;line-height:1.7;
}
.entry-row{
  display:flex;justify-content:space-between;
  padding:7px 0;border-bottom:1px solid var(--border);
  font-size:13px;
}
.entry-row:last-child{border-bottom:none;}
.entry-label{color:var(--muted);}
.entry-value{font-weight:700;}

/* ── PnL MODAL ── */
.pnl-result{border-radius:10px;padding:14px;text-align:center;margin-bottom:14px;}
.pnl-result-label{font-size:10px;letter-spacing:2px;font-weight:700;margin-bottom:6px;}
.pnl-result-value{font-size:28px;font-weight:700;}
.pnl-result-sub{font-size:11px;margin-top:4px;opacity:0.7;}

/* ── MT5ポジション ── */
.pos-banner{
  position:fixed;z-index:95;left:8px;right:8px;
  background:rgba(0,0,0,0.85);border-radius:8px;
  border:1px solid var(--border);
  padding:6px 12px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;
}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;}
.badge-buy{background:rgba(0,217,126,0.15);color:var(--green);border:1px solid var(--green);}
.badge-sell{background:rgba(255,77,106,0.15);color:var(--red);border:1px solid var(--red);}

/* ── LOADING ── */
.loading-overlay{
  display:none;position:absolute;inset:0;
  background:rgba(8,12,18,0.8);
  align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10;
}
.loading-overlay.show{display:flex;}
.loading-bars{display:flex;gap:4px;align-items:flex-end;}
.lb{width:4px;background:var(--gold);border-radius:2px;animation:bar 0.8s ease infinite alternate;}
@keyframes bar{from{height:8px;}to{height:24px;}}
.loading-text{font-size:10px;color:var(--gold);letter-spacing:3px;}

/* ── DOW BADGE ── */
.dow-badge{
  position:absolute;top:8px;left:8px;z-index:10;
  background:rgba(8,12,18,0.82);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px;pointer-events:none;
}
.dow-badge-trend{
  font-size:11px;font-weight:700;font-family:'Space Mono',monospace;
  letter-spacing:1px;
}
.dow-badge-sub{
  font-size:8px;color:var(--muted);margin-top:2px;
  font-family:'Space Mono',monospace;letter-spacing:0.5px;
}

/* ── TRADE PANEL ── */
.trade-panel{
  position:fixed;bottom:60px;left:0;right:0;z-index:95;
  background:var(--surface);border-top:1px solid var(--border);
  padding:8px 12px;
}
.trade-lot-row{
  display:flex;align-items:center;gap:6px;margin-bottom:8px;
}
.trade-lot-row label{font-size:9px;color:var(--muted);letter-spacing:1px;white-space:nowrap;}
.lot-preset{
  padding:5px 10px;background:var(--surface2);
  border:1px solid var(--border);border-radius:6px;
  font-family:'Space Mono',monospace;font-size:10px;
  color:var(--text);cursor:pointer;
}
.lot-preset.active{border-color:var(--gold);color:var(--gold);}
.margin-info{
  font-size:9px;color:var(--muted);letter-spacing:0.5px;
  text-align:center;margin-bottom:6px;
  font-family:'Space Mono',monospace;
}
.trade-btn-row{display:flex;gap:8px;}
.trade-btn{
  flex:1;padding:12px 8px;border:none;border-radius:10px;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  cursor:pointer;letter-spacing:1px;
}
.t-buy{background:linear-gradient(135deg,#006622,var(--green));color:#000;}
.t-sell{background:linear-gradient(135deg,#7a0020,var(--red));color:#fff;}
.t-close{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;font-family:'Space Mono',monospace;
  font-size:10px;color:var(--muted);cursor:pointer;padding:8px;
  display:none;
}
.t-close.show{display:block;}
/* 確認オーバーレイ */
.trd-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);
  z-index:700;align-items:flex-end;justify-content:center;
}
.trd-overlay.show{display:flex;}
.trd-modal{
  width:100%;background:var(--surface);
  border-radius:20px 20px 0 0;padding:24px 16px 40px;
}
.trd-modal h3{font-size:12px;color:var(--gold);letter-spacing:3px;text-align:center;margin-bottom:20px;}
.trd-modal .trd-info{font-size:14px;text-align:center;margin-bottom:6px;color:var(--text);}
.trd-modal .trd-price{font-size:28px;font-weight:700;text-align:center;margin-bottom:16px;}
.trd-tpsl-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.trd-tpsl-field{display:flex;flex-direction:column;gap:4px;}
.trd-tpsl-label{font-size:9px;color:var(--muted);letter-spacing:1px;}
.trd-tpsl-opt{font-size:8px;color:var(--border);margin-left:4px;}
.trd-tpsl-input{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:9px 10px;color:var(--text);
  font-family:'Space Mono',monospace;font-size:12px;outline:none;width:100%;
}
.trd-tpsl-input:focus{border-color:var(--gold);}
/* 注文タイプタブ（Bybitスタイル） */
.trd-type-row{
  display:flex;margin-bottom:14px;
  border-bottom:1px solid var(--border);
}
.trd-type-btn{
  flex:1;padding:8px 4px;background:transparent;
  border:none;border-bottom:2px solid transparent;
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
  color:var(--muted);cursor:pointer;letter-spacing:1px;
  margin-bottom:-1px;transition:color 0.15s,border-color 0.15s;
}
.trd-type-btn.active{border-bottom:2px solid var(--gold);color:var(--gold);}
.trd-limit-price-wrap{margin-bottom:12px;}
.trd-limit-price-label{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;}
.trd-limit-price-input{
  background:var(--bg);border:1px solid var(--gold);border-radius:8px;
  padding:9px 10px;color:var(--text);
  font-family:'Space Mono',monospace;font-size:13px;outline:none;width:100%;
}
.trd-limit-price-input:focus{border-color:var(--green);}
/* トースト */
.trd-toast{
  position:fixed;bottom:200px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.9);border:1px solid var(--border);
  border-radius:12px;padding:12px 24px;font-size:12px;
  color:var(--text);z-index:800;opacity:0;transition:opacity 0.3s;
  white-space:nowrap;
}
.trd-toast.show{opacity:1;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="brand">
    <div class="brand-dot"></div>
    <div class="brand-name">GOLD COPILOT</div>
  </div>
  <div class="header-right">
    <div>
      <div class="price-main" id="hdrPrice">---.--</div>
      <div class="price-change" id="hdrChange">XAUUSDs · MT5</div>
      <div id="hdrPct" style="font-size:10px;text-align:right;margin-top:2px;"></div>
    </div>
    <div class="mt5-badge" id="mt5Badge" onclick="openSettings()">
      <div class="mt5-dot"></div>
      <span id="mt5BadgeText">設定</span>
    </div>
  </div>
</div>

<!-- BALANCE BAR -->
<div class="balance-bar" id="balanceBar">
  <div class="bal-item"><div class="bal-label">残高</div><div class="bal-value" id="balVal">---</div></div>
  <div class="bal-item"><div class="bal-label">証拠金</div><div class="bal-value" id="equityVal">---</div></div>
  <div class="bal-item"><div class="bal-label">含み損益</div><div class="bal-value" id="pnlVal">¥0</div></div>
  <div class="bal-item" onclick="openPosModal()" style="cursor:pointer;"><div class="bal-label">ポジション ▶</div><div class="bal-value" id="posCount" style="color:var(--gold);">0件</div></div>
  <div class="bal-item" onclick="openHistModal()" style="cursor:pointer;"><div class="bal-label">履歴 ▶</div><div class="bal-value" id="histCount" style="color:var(--gold);">---</div></div>
</div>

<!-- TF BAR -->
<div class="tf-bar" id="tfBar">
  <button class="tf-btn" data-tf="1">M1</button>
  <button class="tf-btn" data-tf="5">M5</button>
  <button class="tf-btn active" data-tf="15">M15</button>
  <button class="tf-btn" data-tf="60">H1</button>
  <button class="tf-btn" data-tf="240">H4</button>
  <button class="tf-btn" data-tf="1D">D1</button>
  <button class="tf-btn" data-tf="1W">W1</button>
</div>

<!-- CHART -->
<div class="chart-area" id="chartArea">
  <canvas id="mainChart"></canvas>
  <div class="loading-overlay" id="chartLoading">
    <div class="loading-bars">
      <div class="lb" style="animation-delay:0s"></div>
      <div class="lb" style="animation-delay:0.15s"></div>
      <div class="lb" style="animation-delay:0.3s"></div>
      <div class="lb" style="animation-delay:0.45s"></div>
    </div>
    <div class="loading-text">LOADING...</div>
  </div>
  <!-- ダウ理論バッジ -->
  <div class="dow-badge" id="dowBadge">
    <div class="dow-badge-trend" id="dowBadgeTrend" style="color:var(--muted);">DOW --</div>
    <div class="dow-badge-sub" id="dowBadgeSub">スウィング分析中</div>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="pnl-btn" onclick="openPnL()">損益<br>計算</button>
  <button class="analyze-btn" id="analyzeBtn">⚡ AI分析する</button>
</div>

<!-- 設定モーダル -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">接続設定</div>
    <div class="m-field">
      <label>TwelveData API Key</label>
      <input type="password" id="twelveKey" placeholder="リアルタイム価格用">

function initChartSize() {

// ══ LOAD CHART ══
async function loadChart(tf) {
  document.getElementById('chartLoading').classList.add('show');
  var count = tf==='1'?120:tf==='5'?120:tf==='15'?100:tf==='60'?168:tf==='240'?120:60;

    candles = await fetchMetaApiCandles(tf, count);
    if(candles && candles.length) source = 'MT5';
  }

  // MetaApi未接続またはフォールバック：TwelveData
  if(!candles && TWELVE_KEY) {
    candles = await fetchTwelveData(tf, count);
    if(candles && candles.length) source = 'TwelveData';
  }

  // デモデータ
  if(!candles || !candles.length) {
    candles = generateDemo(tf, count);
    source = 'DEMO';
  }

  chartData = candles;
  document.getElementById('hdrChange').textContent = 'XAUUSDs · ' + source;
  buildChart(candles, overlayLines.concat(entryLines));
  updateHeaderFromCandles(candles);
  document.getElementById('chartLoading').classList.remove('show');
  if(tradeMarks && tradeMarks.length && chartInstance) chartInstance.update('none');
}

// ══ METAAPI CANDLES ══
async function fetchMetaApiCandles(tf, count) {
  var tfMap = {'1':'1m','5':'5m','15':'15m','60':'1h','240':'4h','1D':'1d','1W':'1w'};
  var timeframe = tfMap[tf] || '15m';
  var secMap = {'1':60,'5':300,'15':900,'60':3600,'240':14400,'1D':86400,'1W':604800};
  var sec = secMap[tf] || 900;
  // brokerTimeOffsetでブローカーサーバー時刻に合わせてstartTimeを計算
  var brokerNow = Date.now() + brokerTimeOffset;
  var startTime = new Date(brokerNow - sec*(count*3+10)*1000).toISOString();
  var url = 'https://mt-market-data-client-api-v1.london.agiliumtrade.ai/users/current/accounts/'
    + MT5_ACCOUNT_ID + '/historical-market-data/symbols/XAUUSDs/timeframes/'
    + timeframe + '/candles?startTime=' + encodeURIComponent(startTime) + '&limit=' + (count*3);
  try {
    var res = await fetch(url, {headers:{'auth-token':MT5_TOKEN}});
    if(!res.ok) return null;
    var data = await res.json();
    if(!Array.isArray(data) || !data.length) return null;
    return data.map(function(v){
      var bt = v.brokerTime || '';
      var t;
      if(bt){
        // brokerTimeはUTCなのでZを付けてUTCとして解釈
        t = new Date(bt.replace(' ','T')+'Z').getTime();
      } else {
        t = new Date(v.time).getTime();
      }
      return {
        t: t, bt: bt,
        o: +v.open, h: +v.high, l: +v.low, c: +v.close
      };
    }).sort(function(a,b){return a.t-b.t;}).slice(-count); // 新しいcount件だけ使う
  } catch(e) { return null; }
}

// ══ TWELVEDATA ══
async function fetchTwelveData(tf, count) {
  var ivMap = {'1':'1min','5':'5min','15':'15min','60':'1h','240':'4h','1D':'1day','1W':'1week'};
  var url = 'https://api.twelvedata.com/time_series?symbol=XAU/USD&interval='
    + (ivMap[tf]||'15min') + '&outputsize=' + count + '&apikey=' + TWELVE_KEY;
  try {
    var res = await fetch(url);
    var data = await res.json();
    if(data.status==='error'||!data.values) return null;
    return data.values.slice().reverse().map(function(v){
      return {t:new Date(v.datetime).getTime(),o:+v.open,h:+v.high,l:+v.low,c:+v.close};
    });
  } catch(e) { return null; }
}

// ══ DEMO DATA ══
function generateDemo(tf, count) {
  var base = 2650 + Math.random()*80;
  var sec = {'1':60,'5':300,'15':900,'60':3600,'240':14400,'1D':86400,'1W':604800}[tf]||900;
  var now = Date.now();
  return Array.from({length:count},function(_,i){
    var vol = 5+Math.random()*15, o = base;
    var c = o+(Math.random()-0.49)*vol;
    var h = Math.max(o,c)+Math.random()*vol*0.5;
    var l = Math.min(o,c)-Math.random()*vol*0.5;
    base = c;
    return {t:now-(count-1-i)*sec*1000, o:+o.toFixed(2), h:+h.toFixed(2), l:+l.toFixed(2), c:+c.toFixed(2)};
  });
}

// ══ BUILD CHART ══
function buildChart(candles, lines) {
  var canvas = document.getElementById('mainChart');
  var ctx = canvas.getContext('2d');
  if(chartInstance){ chartInstance.destroy(); chartInstance=null; }

  var lows = candles.map(function(c){return c.l;});
  var highs = candles.map(function(c){return c.h;});
  var closes = candles.map(function(c){return c.c;});

  // Y軸範囲をローソク足+ラインを含めて計算
  var allPrices = lows.concat(highs).filter(function(v){
    return v > 1000 && v < 100000 && !isNaN(v);
  });
  lines.forEach(function(l){
    if(l.price > 1000 && l.price < 100000) allPrices.push(l.price);
  });
  var yAxisMin = Math.min.apply(null, allPrices) * 0.9994;
  var yAxisMax = Math.max.apply(null, allPrices) * 1.0006;

  // c.tをJSTに変換して表示（brokerTimeはUTC→c.tはUTCms）
  var labels = candles.map(function(c){
    var d = new Date(c.t);
    if(currentTf==='1D'||currentTf==='1W'){
      return d.toLocaleDateString('ja-JP',{month:'2-digit',day:'2-digit',timeZone:'Asia/Tokyo'});
    }
    var dateStr = d.toLocaleDateString('ja-JP',{month:'2-digit',day:'2-digit',timeZone:'Asia/Tokyo'});
    var timeStr = d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'});
    return dateStr + ' ' + timeStr;
  });

  var upC='rgba(0,217,126,0.85)', dnC='rgba(255,77,106,0.85)';
  var barColors = candles.map(function(c){return c.c>=c.o?upC:dnC;});

  function calcMA(data, p){
    return data.map(function(_,i){
      if(i<p-1)return null;
      return +(data.slice(i-p+1,i+1).reduce(function(a,b){return a+b;},0)/p).toFixed(2);
    });
  }

  // S/Rライン・建値ラインをdatasetとして追加（annotationsプラグイン不要）
  var lineDatasets = lines.map(function(l){
    // 全データポイントに同じ価格を設定（水平線）
    var lineData = candles.map(function(){ return l.price; });
    return {
      type:'line',
      label:l.label||'',
      data:lineData,
      borderColor:l.color,
      borderWidth:l.width||1.5,
      borderDash:l.dash||[],
      pointRadius:0,
      tension:0,
      fill:false,
      spanGaps:true,
    };
  });

  chartInstance = new Chart(ctx, {
    type:'bar',
    plugins:[{
      id:'candleBody',
      afterDraw:function(chart){
        var xScale=chart.scales.x, yScale=chart.scales.y;
        if(!xScale||!yScale) return;
        var ctx2=chart.ctx;
        var meta=chart.getDatasetMeta(0);
        if(!meta||!meta.data||!meta.data.length) return;
        candles.forEach(function(c,i){
          var bar=meta.data[i];
          if(!bar) return;
          var barW=bar.width||10;
          var x=bar.x;
          var yO=yScale.getPixelForValue(c.o);
          var yC=yScale.getPixelForValue(c.c);
          var top=Math.min(yO,yC);
          var h=Math.abs(yO-yC);
          if(h<1) h=1;
          var isBull=c.c>=c.o;
          ctx2.fillStyle=isBull?'rgba(0,217,126,0.85)':'rgba(255,77,106,0.85)';
          ctx2.fillRect(x-barW/2, top, barW, h);
        });
      }
    }],
    data:{
      labels:labels,
      datasets:[
        {type:'bar',label:'OHLC',data:candles.map(function(c){return[c.l,c.h];}),
         backgroundColor:barColors,borderColor:barColors,borderWidth:1,
         barPercentage:0.5,categoryPercentage:0.8},
        {type:'line',label:'Close',data:closes,
         borderColor:'rgba(200,220,255,0.4)',borderWidth:1,pointRadius:0,tension:0.1,fill:false},
        {type:'line',label:'MA20',data:calcMA(closes,20),
         borderColor:'#f0b429',borderWidth:1.5,pointRadius:0,tension:0.3,fill:false,spanGaps:true},
        {type:'line',label:'MA50',data:calcMA(closes,50),
         borderColor:'#3d8bff',borderWidth:1.5,pointRadius:0,tension:0.3,fill:false,spanGaps:true},
      ].concat(lineDatasets)
    },
    options:{
      responsive:false,
      animation:{duration:150,easing:"easeOutQuart"},
      layout:{padding:{bottom:20}},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:function(ctx){
          var c=candles[ctx.dataIndex];
          return c?['O:'+c.o,'H:'+c.h,'L:'+c.l,'C:'+c.c]:[];
        }}},
      },
      scales:{
        x:{ticks:{display:true,color:'#a0c0e0',font:{size:11,family:'Space Mono'},maxTicksLimit:4,
             padding:10,maxRotation:0,autoSkip:true,autoSkipPadding:20},
           grid:{color:'rgba(30,45,68,0.5)'}},
        y:{position:'right',
           min:yAxisMin,
           max:yAxisMax,
           ticks:{color:'#4a6080',font:{size:9,family:'Space Mono'},maxTicksLimit:8,
                  callback:function(v){return v.toFixed(2);}},
           grid:{color:'rgba(30,45,68,0.5)'}}
      }
    }
  });

  // ライン上にラベルを描画（afterRenderフック）
  chartInstance._lineLabels = lines;
  var originalDraw = chartInstance.draw.bind(chartInstance);
  chartInstance.draw = function() {
    originalDraw();
    drawLineLabels(chartInstance, lines);
    drawTradeMarks(chartInstance, tradeMarks);
  };

  // ダウ理論バッジ更新
  var _dowResult = calcDowTheory(candles);
  updateDowBadge(_dowResult);
}

// ラインラベルをcanvasに直接描画
function drawLineLabels(chart, lines) {
  if(!lines || !lines.length) return;
  var ctx2 = chart.ctx;
  var yScale = chart.scales.y;
  var xScale = chart.scales.x;
  if(!yScale || !xScale) return;
  lines.forEach(function(l) {
    if(!l.label) return;
    var yPos = yScale.getPixelForValue(l.price);
    if(yPos < yScale.top || yPos > yScale.bottom) return;
    ctx2.save();
    ctx2.font = '10px Space Mono, monospace';
    ctx2.fillStyle = l.color;
    ctx2.textAlign = 'left';
    ctx2.textBaseline = 'bottom';
    var text = l.label;
    var textWidth = ctx2.measureText(text).width;
    // 背景
    ctx2.fillStyle = 'rgba(8,12,18,0.8)';
    ctx2.fillRect(xScale.left + 4, yPos - 14, textWidth + 8, 14);
    // テキスト
    ctx2.fillStyle = l.color;
    ctx2.fillText(text, xScale.left + 8, yPos - 2);
    ctx2.restore();
  });
}

// BUY/SELLマークをcanvasに直接描画
function drawTradeMarks(chart, deals) {
  if(!deals || !deals.length || !chartData.length) return;
  var ctx2 = chart.ctx;
  var yScale = chart.scales.y;
  var xScale = chart.scales.x;
  if(!yScale || !xScale) return;

  var chartStart = chartData[0].t;
  var chartEnd = chartData[chartData.length-1].t;

  deals.forEach(function(deal) {
    var dtRaw = deal.brokerTime || deal.time;
    if(!dtRaw) return;
    var dealTime = typeof dtRaw === 'string' && dtRaw.includes(' ')
      ? new Date(dtRaw.replace(' ','T')+'Z').getTime()
      : new Date(dtRaw).getTime();
    if(isNaN(dealTime)) return;
    // チャート表示範囲外はスキップ
    if(dealTime < chartStart || dealTime > chartEnd) return;

    // 最も近いローソク足を探す
    var closestIdx = 0, minDiff = Infinity;
    chartData.forEach(function(c, i) {
      var diff = Math.abs(c.t - dealTime);
      if(diff < minDiff) { minDiff = diff; closestIdx = i; }
    });

    var xPos = xScale.getPixelForValue(closestIdx);
    if(xPos < xScale.left || xPos > xScale.right) return;

    var isBuy = deal.type === 'DEAL_TYPE_BUY';
    var price = deal.price || parseFloat(deal.p) || 0;
    price = parseFloat(price);
    if(price <= 0) return;
    var yMin = yScale.min || 0;
    var yMax = yScale.max || 99999;
    if(price < yMin || price > yMax) return;
    var yPos = yScale.getPixelForValue(price);
    if(yPos < yScale.top || yPos > yScale.bottom) return;

    ctx2.save();
    ctx2.font = 'bold 12px Space Mono, monospace';
    ctx2.textAlign = 'center';

    if(isBuy) {
      ctx2.fillStyle = '#00d97e';
      ctx2.fillText('▲', xPos, yPos + 18);
      ctx2.font = '8px Space Mono, monospace';
      ctx2.fillText(price.toFixed(0), xPos, yPos + 28);
    } else {
      ctx2.fillStyle = '#ff4d6a';
      ctx2.fillText('▽', xPos, yPos - 8);
      ctx2.font = '8px Space Mono, monospace';
      ctx2.fillText(price.toFixed(0), xPos, yPos - 18);
    }
    ctx2.restore();
  });
}

// ══ HEADER PRICE ══
function updateHeaderFromCandles(candles) {
  if(!candles.length) return;
  var last = candles[candles.length-1];
  var first = candles[0];
  dayOpenPrice = first.o;
  document.getElementById('hdrPrice').textContent = last.c.toFixed(2);
  lastPrice = last.c;
  updateHdrPct(last.c);
}

function updateHdrPct(price) {
  var el = document.getElementById('hdrPct');
  if(!el) return;
  if(!dayOpenPrice || dayOpenPrice <= 0) return;
  var pct = (price - dayOpenPrice) / dayOpenPrice * 100;
  var sign = pct >= 0 ? '+' : '';
  el.textContent = sign + pct.toFixed(2) + '%';
  el.className = pct >= 0 ? 'positive' : 'negative';
}

function updateMarginInfo() {
  var lot = parseFloat(document.getElementById('lotInput').value) || 0.01;
  var price = lastPrice || 0;
  var req = price > 0 ? Math.round(lot * price * USD_JPY) : 0;
  var avail = mt5Equity > 0 ? Math.round(mt5Equity) : 0;
  var el = document.getElementById('marginInfo');
  el.textContent = req > 0
    ? '必要証拠金: ¥' + req.toLocaleString() + ' | 利用可能: ¥' + avail.toLocaleString()
    : '必要証拠金: --- | 利用可能: ' + (avail > 0 ? '¥' + avail.toLocaleString() : '---');
}

function updateLivePrice(price) {
  if(price<=0) return;
  var prev = lastPrice;
  lastPrice = price;
  var el = document.getElementById('hdrPrice');
  el.textContent = price.toFixed(2);
  if(prev>0){
    var diff = price-prev;
    el.style.color = diff>=0?'var(--green)':'var(--red)';
    setTimeout(function(){el.style.color='';},400);
  }
  updateHdrPct(price);
  updateMarginInfo();
  // MT5ポジションの損益再計算
  if(mt5Positions.length>0) refreshPositionPnL(price);
}

function connectFinnhubWS() {
  if(!FINNHUB_KEY) return;
  if(tdWs) { tdWs.onclose = null; tdWs.close(); }

  tdWs = new WebSocket('wss://ws.finnhub.io?token=' + FINNHUB_KEY);

  tdWs.onopen = function() {
    tdWsConnected = true;
    console.log('Finnhub WS接続成功');
    tdWs.send(JSON.stringify({type: 'subscribe', symbol: 'OANDA:XAU_USD'}));
    tdWs.send(JSON.stringify({type: 'subscribe', symbol: 'FXCM:XAUUSD'}));
  };

  tdWs.onmessage = function(e) {
    try {
      var msg = JSON.parse(e.data);
      console.log('Finnhub受信:', JSON.stringify(msg).slice(0,100));

      // typeがtradeまたはtypeなしのdataがある場合
      if(msg.data && msg.data.length) {
        var latestTrade = msg.data[msg.data.length - 1];
        // tが秒かミリ秒か判定して統一
        var rawT = latestTrade.t;
        // 2000年以降のUNIX秒は1000000000以上、ミリ秒は1000000000000以上
        finnhubLastTimestamp = rawT > 9999999999 ? rawT : rawT * 1000;
        var price = parseFloat(latestTrade.p);
        if(price > 0) {
          updateLivePrice(price);
          updateTradePrices(price + 0.2, price);
          updateCurrentCandle(price);
        }
      }
    } catch(err) {
      console.error('Finnhub parse error:', err);
    }
  };

  tdWs.onclose = function() {
    tdWsConnected = false;
    if(mt5Connected) {
      console.log('Finnhub WS切断・5秒後再接続');
      setTimeout(connectFinnhubWS, 5000);
    }
  };

  tdWs.onerror = function() { tdWsConnected = false; };
}

function updateCurrentCandle(price) {
  // M1/M5のみリアルタイム更新、それ以外は何もしない
  if(currentTf !== '1' && currentTf !== '5') return;

  if(!chartData.length || !chartInstance) return;
  if(!price || price < 1000 || price > 10000) return;
  if(lastPrice > 0 && Math.abs(price - lastPrice) > 50) return;

  var tfMs = {'1':60000,'5':300000};
  var tfDuration = tfMs[currentTf] || 60000;
  var now = finnhubLastTimestamp || Date.now();
  var candleStart = Math.floor(now / tfDuration) * tfDuration;
  var lastCandle = chartData[chartData.length - 1];

  if(candleStart > lastCandle.t + tfDuration * 0.5) {
    var newCandle = {t: candleStart, o: price, h: price, l: price, c: price, bt: ''};
    chartData.push(newCandle);
    var d = new Date(candleStart);
    var label = (d.getUTCMonth()+1).toString().padStart(2,'0') + '/' +
      d.getUTCDate().toString().padStart(2,'0') + ' ' +
      d.getUTCHours().toString().padStart(2,'0') + ':' +
      d.getUTCMinutes().toString().padStart(2,'0');
    chartInstance.data.labels.push(label);
    var upC='rgba(0,217,126,0.85)';
    chartInstance.data.datasets[0].data.push([price, price]);
    if(Array.isArray(chartInstance.data.datasets[0].backgroundColor)) {
      chartInstance.data.datasets[0].backgroundColor.push(upC);
      chartInstance.data.datasets[0].borderColor.push(upC);
    }
    if(chartInstance.data.datasets[1]) chartInstance.data.datasets[1].data.push(price);
    currentCandleData = newCandle;
    currentCandleStartTime = candleStart;
  } else {
    if(!currentCandleData || currentCandleData.t !== lastCandle.t) {
      currentCandleData = lastCandle;
      currentCandleStartTime = lastCandle.t;
    }
    currentCandleData.c = price;
    if(price > currentCandleData.h) currentCandleData.h = price;
    if(price < currentCandleData.l) currentCandleData.l = price;
  }

  var idx = chartData.length - 1;
  var upC2='rgba(0,217,126,0.85)', dnC2='rgba(255,77,106,0.85)';
  var color2 = currentCandleData.c >= currentCandleData.o ? upC2 : dnC2;
  chartInstance.data.datasets[0].data[idx] = [currentCandleData.l, currentCandleData.h];
  if(Array.isArray(chartInstance.data.datasets[0].backgroundColor)) {
    chartInstance.data.datasets[0].backgroundColor[idx] = color2;
    chartInstance.data.datasets[0].borderColor[idx] = color2;
  }
  if(chartInstance.data.datasets[1]) chartInstance.data.datasets[1].data[idx] = price;
  chartInstance.update('none');
  updateDowBadge(calcDowTheory(chartData));
  if(mt5Positions.length > 0) refreshPositionPnL(price);
}

async function fetchMT5Data(){
  if(!MT5_TOKEN||!MT5_ACCOUNT_ID) return false;
  try {
    // 口座情報
    var r1 = await fetch(
      'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/'+MT5_ACCOUNT_ID+'/account-information',
      {headers:{'auth-token':MT5_TOKEN}});
    if(r1.ok){
      var info=await r1.json();
      document.getElementById('balanceBar').classList.add('show');
      document.getElementById('tfBar').classList.add('with-balance');
      mt5Balance = info.balance || 0;
      mt5Equity = info.equity || 0;
      document.getElementById('balVal').textContent='¥'+Math.round(mt5Balance).toLocaleString();
      document.getElementById('equityVal').textContent='¥'+Math.round(mt5Equity).toLocaleString();
      updateMarginInfo();
      initChartSize();
    }
    // ポジション
    var r2 = await fetch(
      'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/'+MT5_ACCOUNT_ID+'/positions',
      {headers:{'auth-token':MT5_TOKEN}});
    if(r2.ok){
      mt5Positions=await r2.json();
      renderPositions();
    }
    // 現在価格
    var r3 = await fetch(
      'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/'+MT5_ACCOUNT_ID+'/symbols/XAUUSDs/current-price',
      {headers:{'auth-token':MT5_TOKEN}});
    if(r3.ok){
      var pd=await r3.json();
      var bid=parseFloat(pd.bid||0);
      var ask=parseFloat(pd.ask||0);
      if(bid>0) updateLivePrice(bid);
      if(ask>0||bid>0) updateTradePrices(ask||bid, bid);
      // brokerTimeOffsetは不要（変換なし）
      brokerTimeOffset = 0;
    }
    return true;
  } catch(e){ return false; }
}

function renderPositions(){
  var total=0;
  entryLines=[];
  mt5Positions.forEach(function(p){
    var isBuy=(p.type||'').toLowerCase().includes('buy');
    var profitRaw = p.unrealizedProfit || p.profit || 0;
    var rate = p.accountCurrencyExchangeRate || 1;
    var pnlJPY = Math.round(profitRaw * rate * USD_JPY);
    total+=pnlJPY;
    if(p.openPrice){
      // 建値ラインのみ表示（シンプル）
      entryLines.push({
        price:p.openPrice,
        color: pnlJPY>=0 ? '#00d97e' : '#ff4d6a',
        label:(isBuy?'▲ BUY':'▼ SELL')+' '+(p.openPrice.toFixed?p.openPrice.toFixed(2):p.openPrice),
        width:2, dash:[]
      });
    }
  });
  var pnlEl=document.getElementById('pnlVal');
  pnlEl.textContent=(total>=0?'+':'')+'¥'+Math.abs(total).toLocaleString();
  pnlEl.style.color=total>=0?'var(--green)':'var(--red)';
  document.getElementById('posCount').textContent=mt5Positions.length+'件';
  updateCloseButton(mt5Positions);
  // ポジションがある時はチャートを再読み込み（Y軸範囲をMT5価格に合わせる）
  if(mt5Positions.length > 0) {
    // chartDataがない or Y軸範囲がMT5価格と大きくずれている場合は再読み込み
    var needReload = !chartData.length;
    if(!needReload && chartInstance) {
      var yMin = chartInstance.options.scales.y.min || 0;
      var yMax = chartInstance.options.scales.y.max || 0;
      var entryPrice = entryLines[0] ? entryLines[0].price : 0;
      if(entryPrice > 0 && (entryPrice < yMin || entryPrice > yMax)) {
        needReload = true;
      }
    }
    // チャートデータがない時だけ再読み込み
    // ある時はentryLinesだけ更新（buildChartは呼ばない→チラつき防止）
    if(!chartData.length) {
      chartLoadedWithMT5 = true;
      loadChart(currentTf);
    } else if(!chartLoadedWithMT5) {
      chartLoadedWithMT5 = true;
      loadChart(currentTf); // 初回のみ再読み込み
    }
    // 以降はrefreshPositionPnLで損益表示のみ更新
  }
}

function openPosModal(){
  if(!mt5Positions.length){ return; }
  var html = '';
  mt5Positions.forEach(function(p, idx){
    var isBuy = (p.type||'').toLowerCase().includes('buy');
    // profitはUSD建て、USD_JPYで円換算
    var profitRaw = p.unrealizedProfit || p.profit || 0;
    var rate = p.accountCurrencyExchangeRate || 1;
    var pnlJPY = Math.round(profitRaw * rate * USD_JPY);
    var isProfit = pnlJPY >= 0;
    var sigColor = isProfit ? 'var(--green)' : 'var(--red)';

    // AI分析のTP・SL（BUYなら tp>entry、sl<entry）
    var tp = null, sl = null, tpPnl = 0, slPnl = 0;
    if(analysisResult){
      // BUYの場合: tp = entryより上、sl = entryより下
      var rawTp = analysisResult.tp;
      var rawSl = analysisResult.sl;
      if(isBuy){
        tp = rawTp > p.openPrice ? rawTp : rawSl > p.openPrice ? rawSl : null;
        sl = rawSl < p.openPrice ? rawSl : rawTp < p.openPrice ? rawTp : null;
      } else {
        tp = rawTp < p.openPrice ? rawTp : rawSl < p.openPrice ? rawSl : null;
        sl = rawSl > p.openPrice ? rawSl : rawTp > p.openPrice ? rawTp : null;
      }
      if(tp) tpPnl = Math.round(Math.abs(tp - p.openPrice) * (p.volume||0.01) * 100 * USD_JPY);
      if(sl) slPnl = Math.round(Math.abs(sl - p.openPrice) * (p.volume||0.01) * 100 * USD_JPY);
    }

    // アドバイス
    var advice = '';
    if(isProfit && tp && pnlJPY > tpPnl * 0.7){
      advice = '✓ 利確目標に近づいています。利益確定を検討しましょう。';
    } else if(!isProfit && sl && Math.abs(pnlJPY) > slPnl * 0.7){
      advice = '⚠ 損切りラインに近づいています。リスク管理を確認してください。';
    } else if(isProfit){
      advice = 'ポジションは利益中です。焦らず利確目標まで待ちましょう。';
    } else {
      advice = '含み損の状態です。損切りラインを守ってリスク管理を徹底しましょう。';
    }

    html += '<div class="pos-item">';
    html += '<div class="pos-item-header">';
    html += '<span class="pos-item-symbol">'+(p.symbol||'XAUUSDs')+' <span class="badge '+(isBuy?'badge-buy':'badge-sell')+'">'+(isBuy?'BUY':'SELL')+'</span></span>';
    html += '<span class="pos-item-pnl" style="color:'+sigColor+'">'+(pnlJPY>=0?'+':'')+'¥'+Math.abs(pnlJPY).toLocaleString()+'</span>';
    html += '</div>';
    html += '<div class="pos-item-grid">';
    html += '<div class="pos-item-cell"><div class="pos-item-label">建値</div><div class="pos-item-value">'+p.openPrice.toFixed(2)+'</div></div>';
    html += '<div class="pos-item-cell"><div class="pos-item-label">現在値</div><div class="pos-item-value">'+(lastPrice||'---')+'</div></div>';
    html += '<div class="pos-item-cell"><div class="pos-item-label">ロット</div><div class="pos-item-value">'+(p.volume||0.01)+'lot</div></div>';
    html += '<div class="pos-item-cell"><div class="pos-item-label">スワップ</div><div class="pos-item-value">'+(p.swap||0).toFixed(0)+'</div></div>';
    var openTimeStr = p.openTime
      ? new Date(p.openTime).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
      : '---';
    html += '<div class="pos-item-cell" style="grid-column:1/-1"><div class="pos-item-label">建値時刻 (JST)</div><div class="pos-item-value" style="font-size:12px;">'+openTimeStr+'</div></div>';
    html += '</div>';

    if(tp || sl){
      html += '<div class="pos-item-grid">';

// ── 履歴モーダル ──
var positionHistory = [];

async function fetchPositionHistory(){
  if(!MT5_TOKEN || !MT5_ACCOUNT_ID) return;
  var endTime = new Date().toISOString();
  var startTime = new Date(Date.now() - 30*24*60*60*1000).toISOString();
  try {
    var url = 'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/'
      + MT5_ACCOUNT_ID + '/history-deals/time/'
      + encodeURIComponent(startTime) + '/' + encodeURIComponent(endTime);
    var res = await fetch(url, {headers:{'auth-token':MT5_TOKEN}});
    if(!res.ok) return;
    var data = await res.json();
    if(!Array.isArray(data)) return;
    // 決済deal（DEAL_ENTRY_OUT）のみ
    var closedDeals = data.filter(function(d){
      return d.entryType === 'DEAL_ENTRY_OUT';
    });
    positionHistory = closedDeals.sort(function(a,b){ return new Date(b.time||0) - new Date(a.time||0); })
      .slice(0, 20);
    document.getElementById('histCount').textContent = positionHistory.length + '件';
    tradeMarks = closedDeals;
    if(chartInstance) chartInstance.update('none');
  } catch(e) {}
}

function openHistModal(){
  fetchPositionHistory().then(function(){ renderHistModal(); });
  document.getElementById('histModal').classList.add('show');
}
function closeHistModal(){ document.getElementById('histModal').classList.remove('show'); }

function renderHistModal(){
  var el = document.getElementById('histModalContent');
  if(!positionHistory.length){
    el.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;">履歴なし</div>';
    return;
  }
  // profitはJPY建てで返ってくるためそのまま合算
  var totalPnl = positionHistory.reduce(function(s,d){ return s + (parseFloat(d.profit||0)); }, 0);
  var totalColor = totalPnl >= 0 ? 'var(--green)' : 'var(--red)';
  var html = '<div style="text-align:center;margin-bottom:16px;">'
    + '<div style="font-size:10px;color:var(--muted);letter-spacing:1px;">合計損益（直近20件）</div>'
    + '<div style="font-size:24px;font-weight:700;color:'+totalColor+';">'
    + (totalPnl>=0?'+':'') + '¥' + Math.round(totalPnl).toLocaleString()
    + '</div></div>';
  positionHistory.forEach(function(d){
    var isBuy = d.type === 'DEAL_TYPE_BUY';
    var pnlJpy = Math.round(parseFloat(d.profit||0));
    var pnlColor = pnlJpy >= 0 ? 'var(--green)' : 'var(--red)';
    var dtRaw = d.brokerTime || d.time;
    var timeStr;
    if(typeof dtRaw === 'string' && dtRaw.includes(' ')){
      var parts = dtRaw.split(' ');
      var datePart = parts[0].slice(5).replace('-','/');
      var timePart = parts[1].slice(0,5);
      timeStr = datePart + ' ' + timePart;
    } else if(dtRaw) {
      var d2 = new Date(dtRaw);
      timeStr = (d2.getUTCMonth()+1).toString().padStart(2,'0') + '/'
        + d2.getUTCDate().toString().padStart(2,'0') + ' '
        + d2.getUTCHours().toString().padStart(2,'0') + ':'
        + d2.getUTCMinutes().toString().padStart(2,'0');
    } else {
      timeStr = '--';
    }
    var badgeColor = isBuy ? 'var(--green)' : 'var(--red)';
    var badgeText = isBuy ? 'BUY' : 'SELL';
    html += '<div class="pos-item">'
      + '<div class="pos-item-header">'
      + '<div style="display:flex;align-items:center;gap:8px;">'
      + '<span style="font-size:10px;font-weight:700;color:'+badgeColor+';border:1px solid '+badgeColor+';border-radius:4px;padding:2px 6px;">'+badgeText+'</span>'
      + '<span style="font-size:11px;color:var(--muted);">'+timeStr+'</span>'
      + '</div>'
      + '<div style="font-size:18px;font-weight:700;color:'+pnlColor+';">'+(pnlJpy>=0?'+':'')+'¥'+pnlJpy.toLocaleString()+'</div>'
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
      + '<div class="pos-item-cell"><div class="pos-item-label">ロット</div><div class="pos-item-value">'+(parseFloat(d.volume||0).toFixed(2))+'</div></div>'
      + '<div class="pos-item-cell"><div class="pos-item-label">価格</div><div class="pos-item-value">'+(parseFloat(d.price||0).toFixed(2))+'</div></div>'
      + '</div>'
      + '</div>';
  });
  el.innerHTML = html;
}

function showTPSLOnChart(idx){
  var p = mt5Positions[idx];
  if(!p || !analysisResult) return;
  var isBuy = (p.type||'').toLowerCase().includes('buy');
  var rawTp = analysisResult.tp, rawSl = analysisResult.sl;
  var tp, sl;
  if(isBuy){
    tp = rawTp > p.openPrice ? rawTp : rawSl > p.openPrice ? rawSl : null;
    sl = rawSl < p.openPrice ? rawSl : rawTp < p.openPrice ? rawTp : null;
  } else {
    tp = rawTp < p.openPrice ? rawTp : rawSl < p.openPrice ? rawSl : null;
    sl = rawSl > p.openPrice ? rawSl : rawTp > p.openPrice ? rawTp : null;
  }
  var pnlJPY = Math.round((p.unrealizedProfit||p.profit||0) * (p.accountCurrencyExchangeRate||1) * USD_JPY);

  // 建値+TP+SLをentryLinesにセット
  entryLines = [{
    price: p.openPrice,
    color: '#ffffff',
    label: (isBuy?'▲ BUY':'▼ SELL')+' '+p.openPrice.toFixed(2),
    width:2, dash:[]
  }];
  if(tp) entryLines.push({price:tp, color:'#00d97e', label:'✓ 利確 '+tp.toFixed(2), width:1.5, dash:[6,3]});
  if(sl) entryLines.push({price:sl, color:'#ff4d6a', label:'✗ 損切 '+sl.toFixed(2), width:1.5, dash:[6,3]});

  buildChart(chartData, overlayLines.concat(entryLines));
  closePosModal();
}

function runFallbackAnalysis(){
  if(!chartData.length) return;
  var dow = calcDowTheory(chartData);
  var price = lastPrice || chartData[chartData.length-1].c;
  var atr = dow.atr;
  var signal = dow.trend==='上昇トレンド'?'BUY':dow.trend==='下降トレンド'?'SELL':'WAIT';
  var strength = signal==='WAIT'?'弱':'中';
  var r1=dow.resistanceLevels[0]||+(price*1.005).toFixed(2);
  var r2=dow.resistanceLevels[1]||+(price*1.010).toFixed(2);
  var s1=dow.supportLevels[0]||+(price*0.995).toFixed(2);
  var s2=dow.supportLevels[1]||+(price*0.990).toFixed(2);
  var tp=signal==='BUY'?+(price+atr*2).toFixed(2):signal==='SELL'?+(price-atr*2).toFixed(2):+(price+atr*1.5).toFixed(2);
  var sl=signal==='BUY'?+(price-atr*1).toFixed(2):signal==='SELL'?+(price+atr*1).toFixed(2):+(price-atr*1.5).toFixed(2);
  var rrNum=Math.abs(tp-price)/(Math.abs(sl-price)||1);
  var cls=chartData.slice(-20).map(function(c){return c.c;});
  var ma20val=cls.length?(cls.reduce(function(a,b){return a+b;},0)/cls.length).toFixed(2):'--';
  var r={signal:signal,strength:strength,dow_trend:dow.trend,dow_basis:dow.trendDetail,
    entry_reason:['ダウ理論: '+dow.trendDetail,signal==='BUY'?'押し目買い':signal==='SELL'?'戻り売り':'様子見','ATR基準TP/SL'],
    entry:price,tp:tp,sl:sl,rr:'1:'+rrNum.toFixed(1),
    sr:[{label:'R1',price:r1},{label:'R2',price:r2},{label:'S1',price:s1},{label:'S2',price:s2}],
    analysis:dow.trend+'継続。'+dow.trendDetail+'確認。ダウ理論でエントリー検討。',
    warning:'ローカル分析。必ず自己判断でトレードしてください。',
    ma20:ma20val,atr:atr};
  analysisResult=r;
  overlayLines=r.sr.filter(function(l){return l.price>1000&&l.price<100000;}).map(function(s){
    var cm={R1:'#ff4d6a',R2:'#ff8099',S1:'#00d97e',S2:'#66ffbb'};
    return {price:s.price,color:cm[s.label]||'#f0b429',label:s.label,width:1.5,dash:[4,3]};
  });
  buildChart(chartData,overlayLines.concat(entryLines));
  renderAI(r);
}

// ── Claude AIによる本格分析 ──
async function analyzeWithClaude(){
  var dow = calcDowTheory(chartData);
  var atr = dow.atr;
  var recentCandles = chartData.slice(-30).map(function(c){
    return {o:c.o, h:c.h, l:c.l, c:c.c};
  });
  var recentHighPrices = dow.recentHighs.map(function(s){return s.price;});
  var recentLowPrices  = dow.recentLows.map(function(s){return s.price;});
  var ma20 = (function(){
    var cls = chartData.slice(-20).map(function(c){return c.c;});
    return cls.length ? (cls.reduce(function(a,b){return a+b;},0)/cls.length).toFixed(2) : '--';
  })();

  var prompt = `あなたはダウ理論に精通したゴールド（XAU/USD）専門トレーダーです。
ダウ理論のみを根拠として分析し、初心者にわかりやすい日本語で回答してください。
RSIやCCIなどのオシレーターは一切使わないこと。

【チャートデータ】
- 時間足: ${currentTf}
- 現在価格（リアルタイム）: ${lastPrice}
- ※エントリー・TP・SLは必ずこの価格を基準に計算すること
- スウィングハイ（直近）: ${JSON.stringify(recentHighPrices)}
- スウィングロー（直近）: ${JSON.stringify(recentLowPrices)}
- ATR(14): ${atr.toFixed(2)}
- MA20: ${ma20}
- ローソク足データ(直近30本): ${JSON.stringify(recentCandles)}
- 事前判定トレンド: ${dow.trend}（${dow.trendDetail}）

【ダウ理論分析の観点】
1. 高値・安値の切り上がり/切り下がりでトレンドを判定
2. 直近スウィングからサポート・レジスタンスを特定
3. トレンド方向へのエントリーポイントを提示
4. 押し目/戻り目の根拠を明記
5. ATRを活用してTP・SLを設定

以下のJSON形式のみで回答。他のテキスト不要：
{
  "signal": "BUY" または "SELL" または "WAIT",
  "strength": "強" または "中" または "弱",
  "dow_trend": "上昇トレンド" または "下降トレンド" または "レンジ相場" または "転換疑い",
  "dow_basis": "判定根拠（HH/HL/LH/LLの組み合わせを明記・30文字以内）",
  "entry_reason": ["根拠1（20文字以内）","根拠2（20文字以内）","根拠3（20文字以内）"],
  "entry": 数値,
  "tp": 数値,
  "sl": 数値,
  "rr": "例：1:2.1",
  "sr": [
    {"label":"R1","price":数値},
    {"label":"R2","price":数値},
    {"label":"S1","price":数値},
    {"label":"S2","price":数値}
  ],
  "analysis": "ダウ理論に基づく解説（100文字以内）",
  "warning": "注意点（50文字以内）",
  "ma20": ${ma20}
}`;

  // ローディング表示
  document.getElementById('aiPlaceholder').style.display='flex';
  document.getElementById('aiPlaceholder').querySelector('.ai-placeholder-text').textContent='Claudeが分析中...';
  document.getElementById('aiContent').style.display='none';

  try {
    var res = await fetch('https://gold-copilot-worker.gold-copilot.workers.dev/claude', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1000,
        messages: [{role:'user', content: prompt}]
      })
    });

    if(!res.ok) throw new Error('Claude API error: ' + res.status);
    var data = await res.json();
    var text = data.content[0].text.trim();
    // JSONを抽出
    var jsonMatch = text.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('JSON parse error');
    var r = JSON.parse(jsonMatch[0]);
    r.atr = atr;
    analysisResult = r;
    // S/Rラインをチャートに反映（sr配列形式 or 旧形式に対応）
    var srLines = [];
    if(Array.isArray(r.sr)) {
      var srColorMap = {R1:'#ff4d6a',R2:'#ff8099',S1:'#00d97e',S2:'#66ffbb'};
      r.sr.forEach(function(s){
        var col = srColorMap[s.label] || '#f0b429';
        srLines.push({price:s.price, color:col, label:s.label, width:1.5, dash:[4,3]});
      });
    } else {
      // 旧形式フォールバック
      if(r.r1) srLines.push({price:r.r1,color:'#ff4d6a',label:'R1',width:1.5,dash:[4,3]});
      if(r.r2) srLines.push({price:r.r2,color:'#ff8099',label:'R2',width:1,dash:[4,3]});
      if(r.s1) srLines.push({price:r.s1,color:'#00d97e',label:'S1',width:1.5,dash:[4,3]});
      if(r.s2) srLines.push({price:r.s2,color:'#66ffbb',label:'S2',width:1,dash:[4,3]});
    }
    overlayLines = srLines.filter(function(l){ return l.price > 3000 && l.price < 10000; });
    buildChart(chartData,overlayLines.concat(entryLines));
    renderAI(r);
  } catch(err) {
    console.error('Claude分析エラー:', err);
    runFallbackAnalysis();
  }

function renderAI(r){
  var isBuy=r.signal==='BUY', isSell=r.signal==='SELL';
  var sigBg     = isBuy?'rgba(0,217,126,0.12)':isSell?'rgba(255,77,106,0.12)':'rgba(240,180,41,0.1)';
  var sigBorder = isBuy?'var(--green)':isSell?'var(--red)':'var(--gold)';
  var sigColor  = isBuy?'var(--green)':isSell?'var(--red)':'var(--gold)';
  var warnColor = 'var(--gold)';

  // S/Rライン
  var srColorMap = {
    R1:['rgba(255,77,106,0.15)','#ff4d6a'],
    R2:['rgba(255,128,153,0.12)','#ff8099'],
    S1:['rgba(0,217,126,0.15)','#00d97e'],
    S2:['rgba(102,255,187,0.1)','#66ffbb']
  };
  var srItems = '';
  if(Array.isArray(r.sr)){
    r.sr.forEach(function(s){
      var c = srColorMap[s.label] || ['rgba(240,180,41,0.1)','#f0b429'];
      srItems += lineItem(s.label, s.price, c[0], c[1]);
    });
  }

  var rrText = r.rr || '--';
  var displayEntry = lastPrice > 0 ? lastPrice.toFixed(2) : (r.entry || '--');
  var dowTrend  = r.dow_trend  || r.trend || '--';
  var dowBasis  = r.dow_basis  || '';
  var dowColor  = (dowTrend==='上昇トレンド')?'var(--green)'
                 :(dowTrend==='下降トレンド')?'var(--red)':'var(--gold)';
  var reasons   = Array.isArray(r.entry_reason) ? r.entry_reason
                 : (r.reason ? (Array.isArray(r.reason)?r.reason:r.reason.split('\n').filter(Boolean)) : []);
  var warningText = r.warning || r.risk || '';

  var html = '';

  // ── シグナルカード ──
  html += '<div class="signal-card" style="background:'+sigBg+';border:1px solid '+sigBorder+';">'
    + '<div>'
    + '<div class="signal-main" style="color:'+sigColor+'">'+r.signal+'</div>'
    + '<div class="signal-sub" style="color:'+dowColor+'">'+dowTrend+'</div>'
    + '</div>'
    + '<span class="signal-strength" style="background:'+sigBg+';border:1px solid '+sigBorder+';color:'+sigColor+'">'+r.strength+'</span>'
    + '</div>';

  // ── ダウ理論判定カード ──
  html += '<div class="analysis-card" style="border-color:'+dowColor+';margin-bottom:12px;">'
    + '<div class="analysis-head" style="color:'+dowColor+'">📐 ダウ理論判定</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;">'
    + '<div style="background:var(--bg);border-radius:8px;padding:10px;">'
    + '<div style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;">トレンド</div>'
    + '<div style="font-size:15px;font-weight:700;color:'+dowColor+';">'+dowTrend+'</div>'
    + '</div>'
    + '<div style="background:var(--bg);border-radius:8px;padding:10px;">'
    + '<div style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;">判定根拠</div>'
    + '<div style="font-size:12px;font-weight:700;color:'+dowColor+';">'+dowBasis+'</div>'
    + '</div>'
    + '</div>'
    + '</div>';

  // ── MA20 / ATR ──
  html += '<div class="ind-grid">'
    + '<div class="ind-card"><div class="ind-label">MA20</div><div class="ind-value">'+r.ma20+'</div><div class="ind-sub">移動平均</div></div>'
    + '<div class="ind-card"><div class="ind-label">ATR(14)</div><div class="ind-value">'+(r.atr?parseFloat(r.atr).toFixed(2):'--')+'</div><div class="ind-sub">平均変動幅</div></div>'
    + '</div>';

  // ── S/Rライン ──
  if(srItems) html += '<div class="lines-card"><div class="lines-title">S/R ライン（スウィング基準）</div>'+srItems+'</div>';

  // ── エントリー根拠 ──
  if(reasons.length){
    html += '<div class="analysis-card" style="margin-bottom:12px;">';
    html += '<div class="analysis-head">📋 エントリー根拠</div>';
    reasons.forEach(function(re,i){
      html += '<div style="font-size:13px;color:#a0b8d0;padding:5px 0;border-bottom:1px solid var(--border);">'+(i+1)+'. '+re+'</div>';
    });
    html += '</div>';
  }

  // ── エントリー ──
  html += '<div class="entry-card">'
    + entryRow('エントリー', displayEntry, '')
    + entryRow('TP（利確）', r.tp, 'color:var(--green)')
    + entryRow('SL（損切）', r.sl, 'color:var(--red)')
    + entryRow('RR比', rrText, '')
    + '</div>';

  // ── 分析テキスト ──
  if(r.analysis) html += '<div class="analysis-card"><div class="analysis-head">◈ 分析</div><div class="analysis-text">'+r.analysis+'</div></div>';

  // ── 注意 ──
  if(warningText) html += '<div class="analysis-card" style="border-color:'+warnColor+'"><div class="analysis-head" style="color:'+warnColor+'">⚠ 注意</div><div class="analysis-text">'+warningText+'</div></div>';

  document.getElementById('aiPlaceholder').style.display='none';
  var ac = document.getElementById('aiContent');
  ac.innerHTML = html;
  ac.style.display = 'flex';
  ac.style.flexDirection = 'column';
  document.getElementById('aiBody').scrollTop = 0;
}
function lineItem(name,price,bg,color){
  return '<div class="line-item"><span class="line-name">'+name+'</span>'
    +'<span class="line-type" style="background:'+bg+';color:'+color+'">'+price+'</span></div>';
}
function entryRow(label,value,style){
  return '<div class="entry-row"><span class="entry-label">'+label+'</span>'
    +'<span class="entry-value" style="'+style+'">'+value+'</span></div>';
}

// ══ PnL ══
function openPnL(){ document.getElementById('pnlModal').classList.add('show'); }
function closePnL(){ document.getElementById('pnlModal').classList.remove('show'); }
function calcPnL(){
  var dir=document.getElementById('pDir').value;
  var entry=parseFloat(document.getElementById('pEntry').value);
  var exit=parseFloat(document.getElementById('pExit').value);
  var lot=parseFloat(document.getElementById('pLot').value)||0.1;
  var usdjpy=parseFloat(document.getElementById('pUsdJpy').value)||150;
  if(!entry||!exit) return;
  var diff=dir==='buy'?(exit-entry):(entry-exit);
  var pnlJPY=diff*lot*100*usdjpy;
  var isP=pnlJPY>=0;
  var box=document.getElementById('pnlBox');
  box.style.background=isP?'rgba(0,217,126,0.1)':'rgba(255,77,106,0.1)';
  box.style.border='1px solid '+(isP?'var(--green)':'var(--red)');
  document.getElementById('pnlLabel').style.color=isP?'var(--green)':'var(--red)';
  document.getElementById('pnlLabel').textContent=isP?'含み益 / 確定利益':'含み損 / 確定損失';
  document.getElementById('pnlValue').style.color=isP?'var(--green)':'var(--red)';
  document.getElementById('pnlValue').textContent=(isP?'+':'-')+'¥'+Math.abs(Math.round(pnlJPY)).toLocaleString();
  document.getElementById('pnlSub').textContent=(isP?'+':'-')+'$'+Math.abs(diff*lot*100).toFixed(2)+' | '+lot+'lot';
  document.getElementById('pnlResult').style.display='block';
}

// ══ TOUCH ZOOM ══
var _rafPending = false;
function scheduleChartUpdate() {
  if(_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(function() {
    _rafPending = false;
    if(chartInstance) chartInstance.update('none');
  });
}
var _tz={isPan:false,startX:0,lastX:0,pinchDist:0,pinchRange:0,vMin:0,vMax:0};
function initTouchZoom(){
  var c=document.getElementById('mainChart');
  c.addEventListener('touchstart',function(e){
    if(e.touches.length===1){
      _tz.isPan=true;_tz.startX=e.touches[0].clientX;_tz.lastX=e.touches[0].clientX;
      if(chartInstance){var x=chartInstance.scales.x;_tz.vMin=x.min;_tz.vMax=x.max;}
    } else if(e.touches.length===2){
      _tz.isPan=false;
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      _tz.pinchDist=Math.sqrt(dx*dx+dy*dy);
      if(chartInstance){var x=chartInstance.scales.x;_tz.vMin=x.min;_tz.vMax=x.max;_tz.pinchRange=x.max-x.min;}
    }
    e.preventDefault();
  },{passive:false});
  c.addEventListener('touchmove',function(e){
    if(!chartInstance||!chartData.length) return;
    var x=chartInstance.scales.x,total=chartData.length;
    if(e.touches.length===1&&_tz.isPan){
      var dx=e.touches[0].clientX-_tz.lastX;_tz.lastX=e.touches[0].clientX;
      var range=_tz.vMax-_tz.vMin;
      var shift=-dx/c.offsetWidth*range;
      _tz.vMin=Math.max(0,_tz.vMin+shift);
      _tz.vMax=Math.min(total-1,_tz.vMax+shift);
      x.options.min=_tz.vMin;x.options.max=_tz.vMax;
      fitYAxis(_tz.vMin,_tz.vMax);
      scheduleChartUpdate();
    } else if(e.touches.length===2){
      var dx2=e.touches[0].clientX-e.touches[1].clientX;
      var dy2=e.touches[0].clientY-e.touches[1].clientY;
      var dist=Math.sqrt(dx2*dx2+dy2*dy2);
      var scale=_tz.pinchDist/dist;
      var range=Math.max(5,Math.min(total,_tz.pinchRange*scale));
      var center=(_tz.vMin+_tz.vMax)/2;
      _tz.vMin=Math.max(0,center-range/2);
      _tz.vMax=Math.min(total-1,center+range/2);
      x.options.min=_tz.vMin;x.options.max=_tz.vMax;
      fitYAxis(_tz.vMin,_tz.vMax);
      scheduleChartUpdate();
    }
    e.preventDefault();
  },{passive:false});
  c.addEventListener('touchend',function(){_tz.isPan=false;});

  // ── PCマウスホイールズーム ──
  c.addEventListener('wheel',function(e){
    e.preventDefault();
    if(!chartInstance||!chartData.length) return;
    var x=chartInstance.scales.x;
    var total=chartData.length;
    var curMin=x.options.min!==undefined?x.options.min:0;
    var curMax=x.options.max!==undefined?x.options.max:total-1;
    var range=curMax-curMin;
    var factor=e.deltaY>0?1.15:0.87;
    var newRange=Math.max(5,Math.min(total,range*factor));
    var center=(curMin+curMax)/2;
    var newMin=Math.max(0,center-newRange/2);
    var newMax=Math.min(total-1,center+newRange/2);
    x.options.min=newMin; x.options.max=newMax;
    _tz.vMin=newMin; _tz.vMax=newMax;
    fitYAxis(newMin,newMax);
    chartInstance.update('none');
  },{passive:false});

  // ── PCマウスドラッグパン ──
  var _mouse={isDragging:false,startX:0,vMin:0,vMax:0};
  c.addEventListener('mousedown',function(e){
    _mouse.isDragging=true;
    _mouse.startX=e.clientX;
    if(chartInstance){var x=chartInstance.scales.x;_mouse.vMin=x.options.min||0;_mouse.vMax=x.options.max||chartData.length-1;}
    c.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',function(e){
    if(!_mouse.isDragging||!chartInstance||!chartData.length) return;
    var x=chartInstance.scales.x;
    var total=chartData.length;
    var range=_mouse.vMax-_mouse.vMin;
    var dx=e.clientX-_mouse.startX;
    var shift=-dx/c.offsetWidth*range;
    var newMin=Math.max(0,_mouse.vMin+shift);
    var newMax=Math.min(total-1,_mouse.vMax+shift);
    x.options.min=newMin; x.options.max=newMax;
    fitYAxis(newMin,newMax);
    scheduleChartUpdate();
  });
  window.addEventListener('mouseup',function(){
    _mouse.isDragging=false;
    c.style.cursor='crosshair';
  });
  c.style.cursor='crosshair';

  // ダブルクリックでリセット（PC）
  c.addEventListener('dblclick',function(){
    if(chartInstance){
      chartInstance.scales.x.options.min=undefined;
      chartInstance.scales.x.options.max=undefined;
      var allP=[].concat(chartData.map(function(d){return d.l;}),chartData.map(function(d){return d.h;}));
      overlayLines.concat(entryLines).forEach(function(l){if(l.price>0)allP.push(l.price);});
      chartInstance.options.scales.y.min=Math.min.apply(null,allP)*0.9994;
      chartInstance.options.scales.y.max=Math.max.apply(null,allP)*1.0006;
      chartInstance.update('none');
    }
  });

  // ダブルタップでリセット
  var lastTap=0;
  c.addEventListener('touchend',function(){
    var now=Date.now();
    if(now-lastTap<300){
      if(chartInstance){
        chartInstance.scales.x.options.min=undefined;
        chartInstance.scales.x.options.max=undefined;
        var l=chartData.map(function(c){return c.l;});
        var h=chartData.map(function(c){return c.h;});
        chartInstance.options.scales.y.min=Math.min.apply(null,l)*0.9995;
        chartInstance.options.scales.y.max=Math.max.apply(null,h)*1.0005;
        chartInstance.update('none');
      }
    }
    lastTap=now;
  });
}

async function executeTrade(side, lot, price){
  if(!MT5_TOKEN || !MT5_ACCOUNT_ID){
    showTrdToast('MT5未接続です', 'var(--red)'); return;
  }
  // 楽観的UI更新（レスポンスを待たずに即時反映）
  var curCount = mt5Positions.length;
  document.getElementById('posCount').textContent = (curCount + 1) + '件';
  document.getElementById('pnlVal').textContent = '計算中...';
  document.getElementById('pnlVal').style.color = 'var(--muted)';

  var actionTypeMap = {
    'market': 'ORDER_TYPE_' + side.toUpperCase(),
    'limit':  'ORDER_TYPE_' + side.toUpperCase() + '_LIMIT',
    'stop':   'ORDER_TYPE_' + side.toUpperCase() + '_STOP'
  };
  var body = {
    actionType: actionTypeMap[_trdOrderType] || ('ORDER_TYPE_' + side.toUpperCase()),
    symbol: 'XAUUSDs',
    volume: lot,
    comment: 'GoldCopilot'
  };
  if(_trdOrderType !== 'market'){
    var limitPrice = parseFloat(document.getElementById('trdLimitPrice').value);
    if(!isNaN(limitPrice) && limitPrice > 0) body.openPrice = limitPrice;
  }
  var tpVal = parseFloat(document.getElementById('trdTpInput').value);
  var slVal = parseFloat(document.getElementById('trdSlInput').value);
  if(!isNaN(tpVal) && tpVal > 0) body.takeProfit = tpVal;
  if(!isNaN(slVal) && slVal > 0) body.stopLoss = slVal;
  try {
    var res = await fetch(
      'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/' + MT5_ACCOUNT_ID + '/trade',
      {
        method: 'POST',
        headers: {'auth-token': MT5_TOKEN, 'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      }
    );
    if(res.ok){
      var data = await res.json();
      if(data.numericCode === 10009 || data.stringCode === 'TRADE_RETCODE_DONE'){
        showTrdToast((side === 'buy' ? '▲ BUY' : '▼ SELL') + ' ' + lot + 'lot — 注文成功', side === 'buy' ? 'var(--green)' : 'var(--red)');
        setTimeout(fetchMT5Data, 500);
      } else {
        showTrdToast('注文失敗: ' + (data.stringCode || data.numericCode || 'ERROR'), 'var(--red)');
      }
    } else {
      showTrdToast('注文失敗 (HTTP ' + res.status + ')', 'var(--red)');
    }
  } catch(e){
    showTrdToast('通信エラー: ' + e.message, 'var(--red)');
  }
}

async function closeAllPositions(){
  if(!MT5_TOKEN || !MT5_ACCOUNT_ID){
    showTrdToast('MT5未接続です', 'var(--red)'); return;

  if(!mt5Positions.length){ showTrdToast('決済するポジションがありません', 'var(--muted)'); return; }

        {

// ══ ダウ理論計算 ══

function calcATR(candles, period) {
  period = period || 14;
  if(!candles || candles.length < period + 1) return 5;
  var trs = [];
  for(var i = 1; i < candles.length; i++){
    var hl = candles[i].h - candles[i].l;
    var hpc = Math.abs(candles[i].h - candles[i-1].c);
    var lpc = Math.abs(candles[i].l - candles[i-1].c);
    trs.push(Math.max(hl, hpc, lpc));
  }
  var recent = trs.slice(-period);
  return recent.reduce(function(a,b){return a+b;},0) / recent.length;
}

function calcDowTheory(candles) {
  if(!candles || candles.length < 10) {
    return {trend:'判定中', trendDetail:'データ不足', trendColor:'var(--muted)',
      swingHighs:[], swingLows:[], recentHighs:[], recentLows:[],
      resistanceLevels:[], supportLevels:[], atr:5};
  }
  var n = 3;
  var swingHighs = [], swingLows = [];
  for(var si = n; si < candles.length - n; si++){
    var isHigh = true, isLow = true;
    for(var j = 1; j <= n; j++){
      if(candles[si].h <= candles[si-j].h || candles[si].h <= candles[si+j].h) isHigh = false;
      if(candles[si].l >= candles[si-j].l || candles[si].l >= candles[si+j].l) isLow  = false;
    }
    if(isHigh) swingHighs.push({idx:si, price:candles[si].h, t:candles[si].t});
    if(isLow)  swingLows.push( {idx:si, price:candles[si].l, t:candles[si].t});
  }
  var recentHighs = swingHighs.slice(-4);
  var recentLows  = swingLows.slice(-4);

  var hhCount=0, hlCount=0, lhCount=0, llCount=0;
  for(var hi=1; hi<recentHighs.length; hi++){
    if(recentHighs[hi].price > recentHighs[hi-1].price) hhCount++; else lhCount++;
  }
  for(var li=1; li<recentLows.length; li++){
    if(recentLows[li].price > recentLows[li-1].price) hlCount++; else llCount++;
  }

  var trend, trendDetail, trendColor;
  if(hhCount > 0 && hlCount > 0 && lhCount === 0 && llCount === 0){
    trend='上昇トレンド'; trendDetail='HH + HL 確認'; trendColor='var(--green)';
  } else if(lhCount > 0 && llCount > 0 && hhCount === 0 && hlCount === 0){
    trend='下降トレンド'; trendDetail='LH + LL 確認'; trendColor='var(--red)';
  } else if(hhCount > lhCount && hlCount > llCount){
    trend='上昇トレンド'; trendDetail='HH+HL 優勢'; trendColor='var(--green)';
  } else if(lhCount > hhCount && llCount > hlCount){
    trend='下降トレンド'; trendDetail='LH+LL 優勢'; trendColor='var(--red)';
  } else if(hhCount > 0 && llCount > 0){
    trend='転換疑い'; trendDetail='HH+LL 混在'; trendColor='var(--gold)';
  } else {
    trend='レンジ相場'; trendDetail='方向感なし'; trendColor='var(--gold)';
  }

  var atr = calcATR(candles, 14);
  var resistanceLevels = recentHighs.map(function(s){return s.price;})
    .sort(function(a,b){return b-a;}).slice(0,3);
  var supportLevels = recentLows.map(function(s){return s.price;})
    .sort(function(a,b){return a-b;}).slice(0,3);

  return {
    trend:trend, trendDetail:trendDetail, trendColor:trendColor,
    swingHighs:swingHighs, swingLows:swingLows,
    recentHighs:recentHighs, recentLows:recentLows,
    resistanceLevels:resistanceLevels, supportLevels:supportLevels,
    atr:atr
  };
}

function fitYAxis(minIdx,maxIdx){
  var i0=Math.max(0,Math.floor(minIdx)),i1=Math.min(chartData.length-1,Math.ceil(maxIdx));
  var ls=[],hs=[];
  for(var i=i0;i<=i1;i++){
    if(chartData[i] && chartData[i].l > 100){ls.push(chartData[i].l);hs.push(chartData[i].h);}
  }
  if(!ls.length)return;
  // 建値ライン・S/Rラインも範囲に含める
  overlayLines.concat(entryLines).forEach(function(l){
    if(l.price > 1000 && l.price < 100000){ls.push(l.price);hs.push(l.price);}
  });
  chartInstance.options.scales.y.min=Math.min.apply(null,ls)*0.9994;
  chartInstance.options.scales.y.max=Math.max.apply(null,hs)*1.0006;
}
