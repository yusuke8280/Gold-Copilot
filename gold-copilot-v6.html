nがREVERSAL_TO_UPまたはREVERSAL_TO_DOWN\n+1: current_tf_sr_context.near_supportまたはnear_resistanceがtrue\n+1: higher_tf_sr_context.near_resistance（BUY時）またはnear_support（SELL時）がfalse\n充足数がそのままconfidence（1〜5）になる。WAIT時も充足数のままconfidenceを返す。\nただしBUYパターンBまたはSELLパターンBの場合はconfidenceの上限は4とする。\n\nWAIT時はreasonに以下のどれが原因かを必ず含めること：\n・上位足逆行: 上位足トレンドが逆方向\n・障害ライン近接: 上位足レジスタンス（BUY時）またはサポート（SELL時）に近接\n・転換未発生: transitionがNONEで方向転換が確認できない\n・ライン未接近: current_tfのnear_support/near_resistanceが両方false\n・RR不足: candidate_tpとcandidate_slから計算したRRが1.5未満\n\nWAIT時のwait_reason_categoryには上記原因のうち最も主要なものを1つ返す。BUYまたはSELL時はwait_reason_categoryは"なし"を返す。\n\nentry_modeについて:\n- BUYパターンAまたはSELLパターンAの場合: "REVERSAL"\n- BUYパターンBまたはSELLパターンBの場合: "PULLBACK_CONTINUATION"\n- WAIT/WATCHの場合: null\n\nreasonフィールドは必ず日本語の平易な言葉で書いてください。\nコード変数名（near_resistance、higher_tf_sr_context等）やプログラム的な表現は使わないでください。\nトレーダーが直感的に理解できる言葉で2〜3文で説明してください。\n例: ×「higher_tf_sr_context.near_resistance == falseを満たさない」\n   ○「上位足の直近高値に近づきすぎているため、反落リスクがあります」\n\nBULLISH_BIAS は上昇寄りのRANGEです。\nBUYパターンBの条件判定において、\nhigher_tf_dow.trend == "BULLISH_BIAS" は\nhigher_tf_dow.trend == "UP" と同等として扱ってよい。\nただしこの場合のconfidenceは最大3までとする。\n\nBEARISH_BIAS は下降寄りのRANGEです。\nSELLパターンBの条件判定において、\nhigher_tf_dow.trend == "BEARISH_BIAS" は\nhigher_tf_dow.trend == "DOWN" と同等として扱ってよい。\nただしこの場合のconfidenceは最大3までとする。';

  var outputSchema = '以下のJSON形式のみで返答してください。\n{\n  "trend_higher": "UP/DOWN/RANGE",\n  "trend_current": "UP/DOWN/RANGE",\n  "transition": "REVERSAL_TO_UP/REVERSAL_TO_DOWN/NONE",\n  "near_sr_line": {"is_near": true/false, "type": "support/resistance/none", "tf": "current/higher/none"},\n  "action": "BUY/SELL/WATCH_BUY/WATCH_SELL/WAIT",\n  "entry_mode": "REVERSAL/PULLBACK_CONTINUATION/null",\n  "reason": "日本語で2〜3文",\n  "stop_loss": 数値またはnull,\n  "take_profit": 数値またはnull,\n  "risk_reward": 数値またはnull,\n  "confidence": 1〜5の整数,\n  "trend_strength": "STRONG/NORMAL/WEAK/UNKNOWN",\n  "wait_reason_category": "上位足逆行/障害ライン近接/転換未発生/ライン未接近/RR不足/なし"\n}';

  // ローディング表示
  document.getElementById('aiPlaceholder').style.display='flex';
  document.getElementById('aiPlaceholder').querySelector('.ai-placeholder-text').textContent='Claudeが分析中...';
  document.getElementById('aiContent').style.display='none';

  try {
    var res = await fetch('https://gold-copilot-worker.gold-copilot.workers.dev/claude', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 800,
        system: systemPrompt,
        messages: [{role:'user', content: JSON.stringify(inputData, null, 2) + '\n\n' + outputSchema}]
      })
    });
    window._lastAiInput = inputData;

    if(!res.ok) throw new Error('Claude API error: ' + res.status);
    var data = await res.json();
    var text = data.content[0].text.trim();
    var jsonMatch = text.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('JSON parse error');
    var r = JSON.parse(jsonMatch[0]);
    window._lastAiOutput = r;
    aiAnalysisLog.push({
      timestamp: new Date().toISOString(),
      tf: currentTf,
      higher_tf: higherTfMap[currentTf],
      current_price: mt5Bid,
      action: r.action,
      entry_mode: r.entry_mode || null,
      wait_reason_category: r.wait_reason_category || null,
      confidence: r.confidence,
      trend_higher: r.trend_higher,
      trend_higher_key: (window._lastAiInput && window._lastAiInput.higher_tf_dow) ? window._lastAiInput.higher_tf_dow.trend : null,
      trend_current: r.trend_current,
      transition: r.transition,
      near_sr_line: r.near_sr_line,
      stop_loss: r.stop_loss,
      take_profit: r.take_profit,
      risk_reward: r.risk_reward,
      watch_missing_conditions: (function(){
        if(r.action !== 'WATCH_BUY' && r.action !== 'WATCH_SELL') return null;
        var missing = [];
        var _inp = window._lastAiInput || {};
        var _csr = _inp.current_tf_sr_context || {};
        if(r.transition === 'NONE') missing.push('transition');
        if(r.action === 'WATCH_BUY'  && _csr.near_support    === false) missing.push('near_support');
        if(r.action === 'WATCH_SELL' && _csr.near_resistance === false) missing.push('near_resistance');
        return missing.length ? missing : null;
      })()
    });
    window._aiLog = aiAnalysisLog;
    localStorage.setItem('gc_ai_log', JSON.stringify(aiAnalysisLog.slice(-200)));
    console.log('[AI Log] 保存完了 合計:', aiAnalysisLog.length, '件');

    // WATCH→BUY/SELL遷移検知
    if(r.action === 'BUY' || r.action === 'SELL'){
      var watchSide = r.action === 'BUY' ? 'WATCH_BUY' : 'WATCH_SELL';
      var now = Date.now();
      var recent = aiAnalysisLog.slice(-6, -1); // 直前5件（今追加したものを除く）
      for(var wi = recent.length - 1; wi >= 0; wi--){
        var wEntry = recent[wi];
        if(wEntry.action === watchSide && wEntry.tf === currentTf
           && !wEntry.transition_to
           && (now - new Date(wEntry.timestamp).getTime()) < 15 * 60 * 1000){
          wEntry.transition_to = r.action;
          wEntry.transition_time = new Date().toISOString();
          localStorage.setItem('gc_ai_log', JSON.stringify(aiAnalysisLog.slice(-200)));
          console.log('[AI Log] WATCH→' + r.action + ' 遷移を検出');
          break;
        }
      }
    }

    r.atr = atr;
    r._higherTf = higherTf;
    r._currentTf = currentTf;
    analysisResult = r;

    // 現在TF S/Rラインをチャートに反映
    var srColorMap = {R1:'#ff4d6a',R2:'#ff8099',S1:'#00d97e',S2:'#66ffbb'};
    var srLabels = ['R1','R2','S1','S2'];
    var srLines = inputData.sr_lines_current.slice(0,4).map(function(p,i){
      var lbl = srLabels[i] || ('L'+(i+1));
      return {price:p, color:srColorMap[lbl]||'#f0b429', label:lbl, width:1.5, dash:[4,3]};
    });
    overlayLines = srLines.filter(function(l){return l.price>3000&&l.price<10000;});
    buildChart(chartData, overlayLines.concat(entryLines));
    renderAI(r);
  } catch(err) {
    console.error('Claude分析エラー:', err);
    runFallbackAnalysis();
  }
}

function renderAI(r){
  // 新旧フォーマット正規化
  var action    = r.action  || r.signal || 'WAIT';
  var isBuy     = action==='BUY', isSell = action==='SELL';
  var isWatchBuy = action==='WATCH_BUY', isWatchSell = action==='WATCH_SELL';
  var isWatch   = isWatchBuy || isWatchSell;
  var sigBg     = isBuy?'rgba(0,217,126,0.12)':isSell?'rgba(255,77,106,0.12)':isWatch?'rgba(240,180,41,0.15)':'rgba(240,180,41,0.1)';
  var sigBorder = isBuy?'var(--green)':isSell?'var(--red)':'var(--gold)';
  var sigColor  = isBuy?'var(--green)':isSell?'var(--red)':'var(--gold)';

  var trendHigher  = r.trend_higher  || null;
  var trendCurrent = r.trend_current || null;
  var transition   = r.transition    || 'NONE';
  var trendStrength = r.trend_strength || null;
  var confidence   = r.confidence    || null;
  var riskReward   = r.risk_reward  != null ? r.risk_reward  : null;
  var stopLoss     = r.stop_loss   != null ? r.stop_loss   : (r.sl != null ? r.sl : null);
  var takeProfit   = r.take_profit != null ? r.take_profit : (r.tp != null ? r.tp : null);
  var nearSr       = r.near_sr_line  || null;
  var reasonText   = typeof r.reason === 'string' ? r.reason : null;
  var waitReasonCategory = r.wait_reason_category || null;
  var reasonsArr   = Array.isArray(r.entry_reason) ? r.entry_reason
                   : (reasonText ? [reasonText] : []);
  var dowTrend     = r.dow_trend || '--';
  var dowBasis     = r.dow_basis || '';
  var warningText  = r.warning || r.risk || '';

  function _trendEnToJa(t){ return t==='UP'?'上昇':t==='DOWN'?'下降':'レンジ'; }
  function _trendColor(t){
    return (t==='UP'||t==='上昇トレンド') ? 'var(--green)'
         : (t==='DOWN'||t==='下降トレンド') ? 'var(--red)' : 'var(--gold)';
  }

  var html = '';

  // ── 修正1: actionカード（大きく目立たせる） ──
  var actionBg    = isBuy?'#00a86b':isSell?'#d32f2f':isWatchBuy?'#7B5E00':isWatchSell?'#7B5E00':'#555';
  var actionLabel = isBuy?'BUY':isSell?'SELL':isWatchBuy?'👁 WATCH BUY':isWatchSell?'👁 WATCH SELL':'WAIT';
  html += '<div style="background:'+actionBg+';border-radius:12px;padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;">'
    + '<span style="color:#fff;font-size:32px;font-weight:800;letter-spacing:2px;">'+actionLabel+'</span>';

  // 修正4: confidence バー（actionカード右側）
  if(confidence){
    var confDots = '';
    for(var ci=1;ci<=5;ci++) confDots += ci<=confidence ? '●' : '○';
    html += '<div style="text-align:right;">'
      + '<div style="color:rgba(255,255,255,0.7);font-size:10px;margin-bottom:2px;">信頼度</div>'
      + '<div style="color:#fff;font-size:13px;font-weight:700;">'+confidence+'/5</div>'
      + '<div style="color:rgba(255,255,255,0.9);font-size:11px;letter-spacing:1px;">'+confDots+'</div>'
      + '</div>';
  } else if(r.strength){
    html += '<span style="color:rgba(255,255,255,0.8);font-size:13px;">'+r.strength+'</span>';
  }
  html += '</div>';

  // ── 修正2: trend_higher ▶ trend_current 横並び ──
  if(trendHigher || trendCurrent){
    var higherLabel  = trendHigher  ? r._higherTf  || 'HTF' : null;
    var currentLabel = trendCurrent ? r._currentTf || 'CTF' : null;
    html += '<div class="analysis-card" style="margin-bottom:12px;padding:10px 14px;">'
      + '<div style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;">📐 よすが式ダウ理論</div>'
      + '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">';
    if(trendHigher){
      html += '<span style="font-size:11px;color:var(--muted);">上位足('+higherLabel+'):</span>'
        + '<span style="font-size:15px;font-weight:700;color:'+_trendColor(trendHigher)+';">'+trendHigher+'</span>';
    }
    if(trendHigher && trendCurrent){
      html += '<span style="font-size:14px;color:var(--muted);">▶</span>';
    }
    if(trendCurrent){
      html += '<span style="font-size:11px;color:var(--muted);">現在足('+currentLabel+'):</span>'
        + '<span style="font-size:15px;font-weight:700;color:'+_trendColor(trendCurrent)+';">'+trendCurrent+'</span>';
    }
    html += '</div>';

    // 修正3: transition 日本語表示
    var transJa, transColor;
    if(transition === 'REVERSAL_TO_UP'){
      transJa = '↑ 上昇転換'; transColor = 'var(--green)';
    } else if(transition === 'REVERSAL_TO_DOWN'){
      transJa = '↓ 下降転換'; transColor = 'var(--red)';
    } else {
      transJa = '継続中'; transColor = 'var(--muted)';
    }
    html += '<div style="margin-top:6px;font-size:12px;color:'+transColor+';font-weight:600;">'+transJa+'</div>';

    if(trendStrength && trendStrength !== 'UNKNOWN'){
      var tsColor = trendStrength==='STRONG'?'var(--green)':trendStrength==='WEAK'?'var(--red)':'var(--gold)';
      html += '<div style="margin-top:4px;font-size:11px;color:'+tsColor+';">強度: '+trendStrength+'</div>';
    }
    html += '</div>';
  } else {
    // フォールバック: 旧形式ダウ理論判定
    var dowColor2 = _trendColor(dowTrend);
    html += '<div class="analysis-card" style="border-color:'+dowColor2+';margin-bottom:12px;">'
      + '<div class="analysis-head" style="color:'+dowColor2+'">📐 ダウ理論判定</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;">'
      + '<div style="background:var(--bg);border-radius:8px;padding:10px;">'
      + '<div style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;">トレンド</div>'
      + '<div style="font-size:15px;font-weight:700;color:'+dowColor2+';">'+dowTrend+'</div>'
      + '</div>'
      + '<div style="background:var(--bg);border-radius:8px;padding:10px;">'
      + '<div style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;">判定根拠</div>'
      + '<div style="font-size:12px;font-weight:700;color:'+dowColor2+';">'+dowBasis+'</div>'
      + '</div>'
      + '</div>'
      + '</div>';
  }

  // ── 修正6: near_sr_line 人間向け整形 ──
  if(nearSr && nearSr.is_near){
    if(nearSr.type === 'resistance'){
      html += '<div class="analysis-card" style="border-color:var(--red);margin-bottom:12px;">'
        + '<div style="font-size:13px;color:var(--red);font-weight:600;">⚠️ 上位足レジスタンス近接</div>'
        + '</div>';
    } else if(nearSr.type === 'support'){
      html += '<div class="analysis-card" style="border-color:var(--green);margin-bottom:12px;">'
        + '<div style="font-size:13px;color:var(--green);font-weight:600;">📍 上位足サポート近接</div>'
        + '</div>';
    }
  }

  // ── ATR / RR ──
  html += '<div class="ind-grid">'
    + '<div class="ind-card"><div class="ind-label">ATR(14)</div><div class="ind-value">'+(r.atr?parseFloat(r.atr).toFixed(2):'--')+'</div><div class="ind-sub">平均変動幅</div></div>'
    + (riskReward != null ? '<div class="ind-card"><div class="ind-label">RR比</div><div class="ind-value">1:'+parseFloat(riskReward).toFixed(1)+'</div><div class="ind-sub">リスクリワード</div></div>' : '')
    + '</div>';

  // ── S/Rライン（旧形式フォールバック） ──
  if(Array.isArray(r.sr)){
    var srCM = {R1:['rgba(255,77,106,0.15)','#ff4d6a'],R2:['rgba(255,128,153,0.12)','#ff8099'],
                S1:['rgba(0,217,126,0.15)','#00d97e'],S2:['rgba(102,255,187,0.1)','#66ffbb']};
    var srItems = '';
    r.sr.forEach(function(s){
      var c = srCM[s.label]||['rgba(240,180,41,0.1)','#f0b429'];
      srItems += lineItem(s.label, s.price, c[0], c[1]);
    });
    if(srItems) html += '<div class="lines-card"><div class="lines-title">S/R ライン（スウィング基準）</div>'+srItems+'</div>';
  }

  // ── 修正5: WAIT時のreason 強調 / WATCH監視候補ボックス / エントリー根拠 ──
  if(isWatch && reasonText){
    var missingConds = [];
    var inp = window._lastAiInput || {};
    var curSr = inp.current_tf_sr_context || {};
    if(r.transition === 'NONE') missingConds.push('転換シグナル待ち');
    if(isWatchBuy  && curSr.near_support    === false) missingConds.push('サポート接近待ち');
    if(isWatchSell && curSr.near_resistance === false) missingConds.push('レジスタンス接近待ち');
    html += '<div class="analysis-card" style="border:1px solid var(--gold);margin-bottom:12px;">'
      + '<div style="font-size:11px;color:var(--gold);font-weight:700;margin-bottom:6px;">📋 監視条件:</div>'
      + '<div style="font-size:13px;color:#e0c870;line-height:1.6;">'+reasonText+'</div>'
      + (missingConds.length ? '<div style="font-size:11px;color:var(--gold);font-weight:700;margin-top:8px;margin-bottom:4px;">📋 不足条件:</div>'
        + missingConds.map(function(c){ return '<div style="font-size:12px;color:#e0c870;padding:2px 0;">・'+c+'</div>'; }).join('')
        : '')
      + '</div>';
  } else if(action === 'WAIT' && reasonText){
    html += '<div class="analysis-card" style="border:1px solid var(--gold);margin-bottom:12px;">'
      + '<div style="font-size:11px;color:var(--gold);font-weight:700;margin-bottom:6px;">⏸ 見送り理由:</div>'
      + (waitReasonCategory && waitReasonCategory !== 'なし' ? '<div style="font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px;">原因: '+waitReasonCategory+'</div>' : '')
      + '<div style="font-size:13px;color:#e0c870;line-height:1.6;">'+reasonText+'</div>'
      + '</div>';
  } else if(reasonsArr.length){
    html += '<div class="analysis-card" style="margin-bottom:12px;">'
      + '<div class="analysis-head">📋 エントリー根拠</div>';
    reasonsArr.forEach(function(re,i){
      html += '<div style="font-size:13px;color:#a0b8d0;padding:5px 0;border-bottom:1px solid var(--border);">'+(i+1)+'. '+re+'</div>';
    });
    html += '</div>';
  }

  // ── エントリー ──
  var displayEntry = (mt5Bid || chartLastClose) > 0 ? (mt5Bid || chartLastClose).toFixed(2) : (r.entry || '--');
  var rrText = r.rr || (riskReward != null ? '1:'+parseFloat(riskReward).toFixed(1) : '--');
  html += '<div class="entry-card">'
    + entryRow('エントリー', displayEntry, '')
    + entryRow('TP（利確）', takeProfit != null ? takeProfit : '--', 'color:var(--green)')
    + entryRow('SL（損切）', stopLoss   != null ? stopLoss   : '--', 'color:var(--red)')
    + entryRow('RR比', rrText, '')
    + '</div>';

function openPnL(){ document.getElementById('pnlModal').classList.add('show'); }
function closePnL(){ document.getElementById('pnlModal').classList.remove('show'); }
function calcPnL(){
  var dir=document.getElementById('pDir').value;
  var entry=parseFloat(document.getElementById('pEntry').value);
  var exit=parseFloat(document.getElementById('pExit').value);
  var lot=parseFloat(document.getElementById('pLot').value)||0.1;
  var usdjpy=parseFloat(document.getElementById('pUsdJpy').value)||150;
  if(!entry||!exit) return;
  var diff=dir==='buy'?(exit-entry):(entry-exit);
  var pnlJPY=diff*lot*100*usdjpy;
  var isP=pnlJPY>=0;
  var box=document.getElementById('pnlBox');
  box.style.background=isP?'rgba(0,217,126,0.1)':'rgba(255,77,106,0.1)';
  box.style.border='1px solid '+(isP?'var(--green)':'var(--red)');
  document.getElementById('pnlLabel').style.color=isP?'var(--green)':'var(--red)';
  document.getElementById('pnlLabel').textContent=isP?'含み益 / 確定利益':'含み損 / 確定損失';
  document.getElementById('pnlValue').style.color=isP?'var(--green)':'var(--red)';
  document.getElementById('pnlValue').textContent=(isP?'+':'-')+'¥'+Math.abs(Math.round(pnlJPY)).toLocaleString();
  document.getElementById('pnlSub').textContent=(isP?'+':'-')+'$'+Math.abs(diff*lot*100).toFixed(2)+' | '+lot+'lot';
  document.getElementById('pnlResult').style.display='block';
}
function applyEntryLine(){
  var dir=document.getElementById('pDir').value;
  var entry=parseFloat(document.getElementById('pEntry').value);
  var lot=parseFloat(document.getElementById('pLot').value)||0.1;
  var usdjpy=parseFloat(document.getElementById('pUsdJpy').value)||150;
  if(!entry||!chartData.length){alert('エントリー価格を入力してください');return;}
  var price=mt5Bid||chartLastClose||chartData[chartData.length-1].c;
  var diff=dir==='buy'?(price-entry):(entry-price);
  var pnlJPY=Math.round(diff*lot*100*usdjpy);
  var isP=pnlJPY>=0;
  entryLines=[
    {price:entry,color:'#ffffff',label:(dir==='buy'?'BUY':'SELL')+' '+entry.toFixed(2),width:2,dash:[]},
    {price:price,color:isP?'#00d97e':'#ff4d6a',
     label:(isP?'+':'-')+'¥'+Math.abs(pnlJPY).toLocaleString(),width:1.5,dash:[6,3]},
  ];
  if(analysisResult){
    entryLines.push({price:analysisResult.tp,color:'#00d97e',label:'TP '+analysisResult.tp,width:1,dash:[4,3]});
    entryLines.push({price:analysisResult.sl,color:'#ff4d6a',label:'SL '+analysisResult.sl,width:1,dash:[4,3]});
  }
  buildChart(chartData,overlayLines.concat(entryLines));
  closePnL();
}

var _rafPending = false;
function scheduleChartUpdate() {
  if(_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(function() {
    _rafPending = false;
    redrawChart();
  });
}
var _tz={isPan:false,lastX:0,pinchDist:0,pinchRange:0,vMin:0,vMax:0,anchorIdx:0,anchorRelX:0};
// rangeをTF上下限 + total にクランプ（グローバルヘルパー）
function _clampRange(range,total){
  var map={
    '1':  {min:6, max:120},
    '5':  {min:6, max:100},
    '15': {min:6, max:80},
    '60': {min:4, max:60},
    '240':{min:3, max:40},
    '1D': {min:3, max:40},
    '1W': {min:3, max:40}
  };
  var lim=map[currentTf]||{min:4,max:80};
  return Math.max(lim.min, Math.min(Math.min(total,lim.max), range));
}
function initTouchZoom(){
  var c=document.getElementById('mainChart');

  // 時間足ごとのズーム上下限
  function _tfZoomLimits(){
    var map={
      '1':  {min:6, max:120},
      '5':  {min:6, max:100},
      '15': {min:6, max:80},
      '60': {min:4, max:60},
      '240':{min:3, max:40},
      '1D': {min:3, max:40},
      '1W': {min:3, max:40}
    };
    return map[currentTf]||{min:4,max:80};
  }

  c.addEventListener('touchstart',function(e){
    if(e.touches.length===1){
      _tz.isPan=true; _tz.lastX=e.touches[0].clientX;
      _tz.vMin=_cv.vMin; _tz.vMax=_cv.vMax;
    } else if(e.touches.length===2){
      _tz.isPan=false;
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      _tz.pinchDist=Math.sqrt(dx*dx+dy*dy);
      _tz.vMin=_cv.vMin; _tz.vMax=_cv.vMax;
      _tz.pinchRange=_cv.vMax-_cv.vMin;
      // ピンチ中心足indexをアンカーとして記録
      var midX=(e.touches[0].clientX+e.touches[1].clientX)/2;
      var rect=c.getBoundingClientRect();
      var relX=Math.max(0,Math.min(1,(midX-rect.left)/Math.max(1,rect.width)));
      _tz.anchorIdx=_cv.vMin+relX*(_cv.vMax-_cv.vMin);
      _tz.anchorRelX=relX;
    }
    e.preventDefault();
  },{passive:false});

  c.addEventListener('touchmove',function(e){
    if(!_cv.candles.length) return;
    var total=_cv.candles.length;
    if(e.touches.length===1&&_tz.isPan){
      followLatest = false;
      var dx=e.touches[0].clientX-_tz.lastX; _tz.lastX=e.touches[0].clientX;
      var range=_tz.vMax-_tz.vMin;
      var shift=-dx/c.offsetWidth*range;
      _tz.vMin=Math.max(0,_tz.vMin+shift);
      _tz.vMax=Math.min(total-1,_tz.vMax+shift);
      _cv.vMin=_tz.vMin; _cv.vMax=_tz.vMax;
      _fitY(_cv.vMin,_cv.vMax);
      scheduleChartUpdate();
    } else if(e.touches.length===2){
      followLatest = false;
      var dx2=e.touches[0].clientX-e.touches[1].clientX;
      var dy2=e.touches[0].clientY-e.touches[1].clientY;
      var dist=Math.sqrt(dx2*dx2+dy2*dy2);
      var scale=_tz.pinchDist/dist;
      var range=_clampRange(_tz.pinchRange*scale, total);
      // ピンチ中心の現在画面位置を取得してアンカーを維持
      var midX2=(e.touches[0].clientX+e.touches[1].clientX)/2;
      var rect2=c.getBoundingClientRect();
      var relX2=Math.max(0,Math.min(1,(midX2-rect2.left)/Math.max(1,rect2.width)));
      var newVMin=_tz.anchorIdx-relX2*range;
      var newVMax=newVMin+range;
      if(newVMin<0){newVMin=0;newVMax=range;}
      if(newVMax>total-1){newVMax=total-1;newVMin=Math.max(0,newVMax-range);}
      _cv.vMin=newVMin; _cv.vMax=newVMax;
      _fitY(_cv.vMin,_cv.vMax);
      scheduleChartUpdate();
    }
    e.preventDefault();
  },{passive:false});

  c.addEventListener('touchend',function(){_tz.isPan=false;});

  // ── ホイールズーム ──
  c.addEventListener('wheel',function(e){
    e.preventDefault();
    if(!_cv.candles.length) return;
    followLatest = false;
    var total=_cv.candles.length;
    var range=_cv.vMax-_cv.vMin;
    var factor=e.deltaY>0?1.15:0.87;
    var newRange=_clampRange(range*factor, total);
    var center=(_cv.vMin+_cv.vMax)/2;
    _cv.vMin=Math.max(0,center-newRange/2);
    _cv.vMax=Math.min(total-1,center+newRange/2);
    _fitY(_cv.vMin,_cv.vMax);
    redrawChart();
  },{passive:false});

  // ── マウスドラッグパン ──
  var _mouse={isDragging:false,startX:0,vMin:0,vMax:0};
  c.addEventListener('mousedown',function(e){
    _mouse.isDragging=true; _mouse.startX=e.clientX;
    _mouse.vMin=_cv.vMin; _mouse.vMax=_cv.vMax;
    c.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',function(e){
    if(!_mouse.isDragging||!_cv.candles.length) return;
    followLatest = false;
    var total=_cv.candles.length;
    var range=_mouse.vMax-_mouse.vMin;
    var shift=-(e.clientX-_mouse.startX)/c.offsetWidth*range;
    _cv.vMin=Math.max(0,_mouse.vMin+shift);
    _cv.vMax=Math.min(total-1,_mouse.vMax+shift);
    _fitY(_cv.vMin,_cv.vMax);
    scheduleChartUpdate();
  });
  window.addEventListener('mouseup',function(){
    _mouse.isDragging=false; c.style.cursor='crosshair';
  });
  c.style.cursor='crosshair';

  // ── ダブルクリック/ダブルタップでリセット ──
  function resetView(){
    resetZoomToDefault();
  }
  c.addEventListener('dblclick',resetView);
  var lastTap=0;
  c.addEventListener('touchend',function(){
    var now=Date.now();
    if(now-lastTap<300) resetView();
    lastTap=now;
  });
}

// 標準表示へ復帰（外部からも呼び出し可）
function resetZoomToDefault(){
  if(!_cv.candles.length) return;
  followLatest = true;
  resetViewportToLatest();
  _fitY(_cv.vMin, _cv.vMax);
  redrawChart();
}

function showTrdToast(msg, color){

async function executeTrade(side, lot, price){
  if(_orderInProgress) return;
  if(!MT5_TOKEN || !MT5_ACCOUNT_ID){
    showTrdToast('MT5未接続です', 'var(--red)'); return;
  }
  _orderInProgress = true;
  var _buyBtn     = document.getElementById('trdBuyBtn');
  var _sellBtn    = document.getElementById('trdSellBtn');
  var _confirmBtn = document.getElementById('trdConfirmOk');
  var _origBuyHtml  = _buyBtn     ? _buyBtn.innerHTML     : '';
  var _origSellHtml = _sellBtn    ? _sellBtn.innerHTML    : '';
  var _origOkText   = _confirmBtn ? _confirmBtn.textContent : '';
  if(_buyBtn)     { _buyBtn.disabled     = true; _buyBtn.textContent     = '送信中...'; }
  if(_sellBtn)    { _sellBtn.disabled    = true; _sellBtn.textContent    = '送信中...'; }
  if(_confirmBtn) { _confirmBtn.disabled = true; _confirmBtn.textContent = '送信中...'; }
  try {
  // 楽観的UI更新（レスポンスを待たずに即時反映）
  var curCount = mt5Positions.length;
  document.getElementById('posCount').textContent = (curCount + 1) + '件';
  document.getElementById('pnlVal').textContent = '計算中...';
  document.getElementById('pnlVal').style.color = 'var(--muted)';

  var actionTypeMap = {
    'market': 'ORDER_TYPE_' + side.toUpperCase(),
    'limit':  'ORDER_TYPE_' + side.toUpperCase() + '_LIMIT',
    'stop':   'ORDER_TYPE_' + side.toUpperCase() + '_STOP'
  };
  var body = {
    actionType: actionTypeMap[_trdOrderType] || ('ORDER_TYPE_' + side.toUpperCase()),
    symbol: 'XAUUSDs',
    volume: lot,
    comment: 'GoldCopilot'
  };
  if(_trdOrderType !== 'market'){
    var limitPrice = parseFloat(document.getElementById('trdLimitPrice').value);
    if(!isNaN(limitPrice) && limitPrice > 0) body.openPrice = limitPrice;
  }
  var tpVal = parseFloat(document.getElementById('trdTpInput').value);
  var slVal = parseFloat(document.getElementById('trdSlInput').value);
  if(!isNaN(tpVal) && tpVal > 0) body.takeProfit = tpVal;
  if(!isNaN(slVal) && slVal > 0) body.stopLoss = slVal;
  try {
    var res = await fetch(
      'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/' + MT5_ACCOUNT_ID + '/trade',
      {
        method: 'POST',
        headers: {'auth-token': MT5_TOKEN, 'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      }
    );
    if(res.ok){
      var data = await res.json();
      if(data.numericCode === 10009 || data.stringCode === 'TRADE_RETCODE_DONE'){
        showTrdToast((side === 'buy' ? '▲ BUY' : '▼ SELL') + ' ' + lot + 'lot — 注文成功', side === 'buy' ? 'var(--green)' : 'var(--red)');
        setTimeout(fetchMT5Data, 500);
      } else {
        showTrdToast('注文失敗: ' + (data.stringCode || data.numericCode || 'ERROR'), 'var(--red)');
      }
    } else {
      showTrdToast('注文失敗 (HTTP ' + res.status + ')', 'var(--red)');
    }
  } catch(e){
    showTrdToast('通信エラー: ' + e.message, 'var(--red)');
  }
  } finally {
    _orderInProgress = false;
    var _isStaleNow = _lastDataUpdate > 0 && (Date.now() - _lastDataUpdate) / 1000 >= 30;
    if(_buyBtn)     { _buyBtn.innerHTML      = _origBuyHtml;  _buyBtn.disabled     = _isStaleNow; _buyBtn.title  = _isStaleNow ? 'データが古いため発注できません' : ''; }
    if(_sellBtn)    { _sellBtn.innerHTML     = _origSellHtml; _sellBtn.disabled    = _isStaleNow; _sellBtn.title = _isStaleNow ? 'データが古いため発注できません' : ''; }
    if(_confirmBtn) { _confirmBtn.textContent = _origOkText;  _confirmBtn.disabled = false; }
  }
}

async function closeAllPositions(){
  if(_orderInProgress) return;
  if(!MT5_TOKEN || !MT5_ACCOUNT_ID){
    showTrdToast('MT5未接続です', 'var(--red)'); return;
  }
  if(!mt5Positions.length){ showTrdToast('決済するポジションがありません', 'var(--muted)'); return; }
  _orderInProgress = true;
  var _closeBtn = document.getElementById('trdCloseBtn');
  if(_closeBtn){ _closeBtn.disabled = true; _closeBtn.textContent = '処理中...'; }

  document.getElementById('posCount').textContent = '0件';

  entryLines = [];

      return fetch(
        'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/' + MT5_ACCOUNT_ID + '/trade',
        {
          method: 'POST',
          headers: {'auth-token': MT5_TOKEN, 'Content-Type': 'application/json'},
          body: JSON.stringify({actionType: 'POSITION_CLOSE_ID', positionId: p.id})
        }
      );
    });
    await Promise.all(promises);
    showTrdToast(count + '件のポジションを決済しました', 'var(--gold)');
    setTimeout(fetchMT5Data, 500);
  } catch(e){
    showTrdToast('決済エラー: ' + e.message, 'var(--red)');
  } finally {
    _orderInProgress = false;
    if(_closeBtn){ _closeBtn.disabled = false; _closeBtn.textContent = '全決済'; }
  }
}

      if(_trdOrderType === 'limit'){
        if(_trdSide === 'buy' && lp >= _trdPrice){
          errEl.textContent = '指値BUYは現在価格より低い価格を入力してください'; errEl.style.display = 'block'; return;
        }
        if(_trdSide === 'sell' && lp <= _trdPrice){
          errEl.textContent = '指値SELLは現在価格より高い価格を入力してください'; errEl.style.display = 'block'; return;
        }
      }
    }
    // TP/SLバリデーション
    if(!isNaN(tp) && !isNaN(sl) && tp > 0 && sl > 0){
      if(_trdSide === 'buy' && tp <= sl){
        errEl.textContent = 'BUYはTP > SLにしてください'; errEl.style.display = 'block'; return;
      }
      if(_trdSide === 'sell' && tp >= sl){
        errEl.textContent = 'SELLはTP < SLにしてください'; errEl.style.display = 'block'; return;
      }
    }
    errEl.style.display = 'none';
    closeTrdOverlay();
    executeTrade(_trdSide, lot, _trdPrice);
  });
  // オーバーレイ外タップで閉じる
  document.getElementById('trdOverlay').addEventListener('click', function(e){
    if(e.target === this) closeTrdOverlay();
  });

  // タブ復帰・スマホ画面復帰時の自動再接続
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      console.log('[visibility] 復帰検知');
      var now = Date.now();
      if(!mt5Connected || (now - _lastDataUpdate) > 30000){
        console.log('[visibility] 再接続開始');
        connectAll();
      } else {
        loadChart(currentTf);
      }
    }
  });

  window.addEventListener('pageshow', function(e){
    if(e.persisted){
      console.log('[pageshow] キャッシュ復帰 → 再接続');
      connectAll();
    }
  });
});

// ══ ダウ理論計算 ══

function calcATR(candles, period) {
  period = period || 14;
  if(!candles || candles.length < period + 1) return 5;
  var trs = [];
  for(var i = 1; i < candles.length; i++){
    var hl = candles[i].h - candles[i].l;
    var hpc = Math.abs(candles[i].h - candles[i-1].c);
    var lpc = Math.abs(candles[i].l - candles[i-1].c);
    trs.push(Math.max(hl, hpc, lpc));
  }
  var recent = trs.slice(-period);
  return recent.reduce(function(a,b){return a+b;},0) / recent.length;
}

function calcDowTheory(candles) {
  // 週明け最初の足（OHLCズレリスク）を除外してから分析
  var _weekendBars = candles ? candles.filter(function(c){ return c.isFirstBarAfterWeekend; }).length : 0;
  if(_weekendBars > 0) {
    console.log('[calcDowTheory] 週明け足除外:', _weekendBars, '本');
    candles = candles.filter(function(c){ return !c.isFirstBarAfterWeekend; });
  }
  if(!candles || candles.length < 10) {
    return {trend:'判定中', trendDetail:'データ不足', trendColor:'var(--muted)',
      swingHighs:[], swingLows:[], recentHighs:[], recentLows:[],
      resistanceLevels:[], supportLevels:[], atr:5};
  }
  var n = 3;
  var swingHighs = [], swingLows = [];
  for(var si = n; si < candles.length - n; si++){
    var isHigh = true, isLow = true;
    for(var j = 1; j <= n; j++){
      if(candles[si].h <= candles[si-j].h || candles[si].h <= candles[si+j].h) isHigh = false;
      if(candles[si].l >= candles[si-j].l || candles[si].l >= candles[si+j].l) isLow  = false;
    }
    if(isHigh) swingHighs.push({idx:si, price:candles[si].h, t:candles[si].t});
    if(isLow)  swingLows.push( {idx:si, price:candles[si].l, t:candles[si].t});
  }
  var recentHighs = swingHighs.slice(-4);
  var recentLows  = swingLows.slice(-4);

  var hhCount=0, hlCount=0, lhCount=0, llCount=0;
  for(var hi=1; hi<recentHighs.length; hi++){
    if(recentHighs[hi].price > recentHighs[hi-1].price) hhCount++; else lhCount++;
  }
  for(var li=1; li<recentLows.length; li++){
    if(recentLows[li].price > recentLows[li-1].price) hlCount++; else llCount++;
  }

  var bullScore = hhCount + hlCount;
  var bearScore = lhCount + llCount;
  var diff = bullScore - bearScore;
  var trend, trendKey, trendDetail, trendColor;
  if(diff >= 2){
    trend='上昇トレンド'; trendDetail='HH+HL 明確優勢'; trendColor='var(--green)'; trendKey='UP';
  } else if(diff <= -2){
    trend='下降トレンド'; trendDetail='LH+LL 明確優勢'; trendColor='var(--red)'; trendKey='DOWN';
  } else if(diff === 1){
    trend='上昇バイアス'; trendDetail='HH+HL やや優勢'; trendColor='#66cc88'; trendKey='BULLISH_BIAS';
  } else if(diff === -1){
    trend='下降バイアス'; trendDetail='LH+LL やや優勢'; trendColor='#ff8099'; trendKey='BEARISH_BIAS';
  } else {
    trend='レンジ相場'; trendDetail='方向感なし'; trendColor='var(--gold)'; trendKey='RANGE';
  }

  var atr = calcATR(candles, 14);
  var resistanceLevels = recentHighs.map(function(s){return s.price;})
    .sort(function(a,b){return b-a;}).slice(0,3);
  var supportLevels = recentLows.map(function(s){return s.price;})
    .sort(function(a,b){return a-b;}).slice(0,3);

  return {
    trend:trend, trendKey:trendKey, trendDetail:trendDetail, trendColor:trendColor,
    swingHighs:swingHighs, swingLows:swingLows,
    recentHighs:recentHighs, recentLows:recentLows,
    resistanceLevels:resistanceLevels, supportLevels:supportLevels,
    atr:atr
  };
}

function updateDowBadge(dow) {
  var el  = document.getElementById('dowBadgeTrend');
  var sub = document.getElementById('dowBadgeSub');
  if(!el || !sub) return;
  el.textContent  = dow.trend;
  el.style.color  = dow.trendColor || 'var(--muted)';
  sub.textContent = dow.trendDetail;
}

function fitYAxis(minIdx,maxIdx){
  _cv.vMin=minIdx; _cv.vMax=maxIdx;
  _fitY(minIdx,maxIdx);
}
