<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GOLD Copilot</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080c12">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Chart.js removed: Canvas直接描画に移行 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#080c12;--surface:#0d1420;--surface2:#111a2a;--border:#1e2d44;
  --gold:#f0b429;--green:#00d97e;--red:#ff4d6a;--blue:#3d8bff;
  --text:#e8f0ff;--muted:#4a6080;
}
html,body{
  width:100%;height:100%;
  background:var(--bg);color:var(--text);
  font-family:'Space Mono',monospace;
  overflow:hidden;position:fixed;
}

/* ── HEADER ── */
.header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;height:54px;
  background:linear-gradient(180deg,rgba(8,12,18,0.98),rgba(8,12,18,0.85));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:8px;}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.brand-name{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--gold);}
.header-right{display:flex;align-items:center;gap:8px;}
.price-main{font-size:22px;font-weight:700;font-family:'Space Mono',monospace;text-align:right;}
.price-change{font-size:10px;font-family:'Space Mono',monospace;margin-top:1px;text-align:right;}
.positive{color:var(--green);}
.negative{color:var(--red);}
.mt5-badge{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,77,106,0.15);border:1px solid var(--red);
  border-radius:6px;padding:4px 8px;font-size:10px;color:var(--red);cursor:pointer;
}
.mt5-badge.connected{background:rgba(0,217,126,0.15);border-color:var(--green);color:var(--green);}
.mt5-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ── BALANCE BAR ── */
.balance-bar{
  position:fixed;top:54px;left:0;right:0;z-index:90;
  display:none;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:5px 14px;
  display:none;
  grid-template-columns:repeat(5,1fr);gap:4px;
}
.balance-bar.show{display:grid !important;}
.bal-item{display:flex;flex-direction:column;align-items:center;}
.bal-label{font-size:8px;color:var(--muted);letter-spacing:1px;}
.bal-value{font-size:12px;font-weight:700;margin-top:1px;}

/* ── TF BAR ── */
.tf-bar{
  position:fixed;left:0;right:0;z-index:90;
  display:flex;background:var(--surface);
  border-bottom:1px solid var(--border);
  top:54px;
  transition:top 0.2s;
}
.tf-bar.with-balance{top:88px;}
.tf-btn{
  flex:1;padding:8px 0;font-size:11px;font-weight:700;
  font-family:'Space Mono',monospace;letter-spacing:1px;
  background:none;border:none;color:var(--muted);cursor:pointer;
}
.tf-btn.active{color:var(--gold);border-bottom:2px solid var(--gold);}

/* ── CHART ── */
.chart-area{
  position:fixed;left:0;right:0;bottom:170px;
  top:88px;
  transition:top 0.2s;
  background:var(--bg);
}
.chart-area.with-balance{top:122px;}
canvas{display:block;width:100% !important;}

/* ── BOTTOM BAR ── */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;height:60px;
  background:var(--surface);border-top:1px solid var(--border);
}
.pnl-btn{
  padding:10px 14px;background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;
  font-family:'Space Mono',monospace;font-size:10px;
  color:var(--text);cursor:pointer;white-space:nowrap;
}
.analyze-btn{
  flex:1;padding:12px;
  background:linear-gradient(135deg,#c47a00,var(--gold));
  border:none;border-radius:10px;
  font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
  color:#000;cursor:pointer;letter-spacing:1px;
}

/* ── MODAL（共通）── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.75);z-index:500;
  align-items:flex-end;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal{
  width:100%;max-height:90vh;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 16px 40px;
}
.modal-handle{
  width:36px;height:4px;
  background:var(--border);border-radius:2px;
  margin:0 auto 16px;
}
.modal-title{
  font-size:12px;color:var(--gold);
  letter-spacing:3px;margin-bottom:16px;text-align:center;
}
.m-field{margin-bottom:12px;}
.m-field label{font-size:9px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:4px;}
.m-field input,.m-field select{
  width:100%;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;color:var(--text);
  font-family:'Space Mono',monospace;font-size:12px;outline:none;
}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.modal-close{
  width:100%;padding:12px;margin-top:8px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--muted);
  font-size:12px;cursor:pointer;font-family:'Space Mono',monospace;
}
.btn-green{
  flex:1;padding:12px;
  background:linear-gradient(135deg,#006622,var(--green));
  border:none;border-radius:10px;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  color:#000;cursor:pointer;
}
.btn-red{
  flex:1;padding:12px;
  background:rgba(255,77,106,0.15);border:1px solid var(--red);
  border-radius:10px;font-family:'Space Mono',monospace;
  font-size:11px;color:var(--red);cursor:pointer;
}
.status-msg{
  padding:10px 12px;border-radius:8px;
  font-size:11px;margin-bottom:12px;display:none;
}

/* ── AI MODAL（全画面）── */
.ai-overlay{
  display:none;position:fixed;inset:0;z-index:600;
  background:var(--bg);flex-direction:column;
}
.ai-overlay.show{display:flex;}
.ai-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.ai-header-title{font-size:13px;color:var(--gold);letter-spacing:2px;}
.ai-close-btn{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);
  font-size:13px;padding:8px 18px;cursor:pointer;
  font-family:'Space Mono',monospace;
}
.ai-body{
  flex:1;overflow-y:scroll;
  -webkit-overflow-scrolling:touch;
  padding:16px;
}
.ai-placeholder{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:200px;gap:12px;
}
.ai-placeholder-icon{font-size:40px;}
.ai-placeholder-text{font-size:11px;color:var(--muted);letter-spacing:2px;}

/* ── AI コンテンツ ── */
.signal-card{
  border-radius:12px;padding:16px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;
}
.signal-main{font-size:32px;font-weight:700;letter-spacing:2px;}
.signal-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.signal-strength{font-size:13px;padding:4px 12px;border-radius:20px;font-weight:700;}
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.ind-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px;
}
.ind-label{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.ind-value{font-size:26px;font-weight:700;}
.ind-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.lines-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:12px;
}
.lines-title{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:10px;}
.line-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;border-bottom:1px solid var(--border);
}
.line-item:last-child{border-bottom:none;}
.line-name{font-size:13px;color:var(--muted);}
.line-price{font-size:14px;font-weight:700;}
.line-type{font-size:10px;padding:2px 8px;border-radius:10px;}
.analysis-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:12px;
}
.analysis-head{font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:8px;}
.analysis-text{font-size:14px;line-height:1.9;color:#a0b8d0;}
.entry-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:12px;
}
/* ── ポジション詳細モーダル ── */
.pos-modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.75);z-index:500;
  align-items:flex-end;justify-content:center;
}
.pos-modal-overlay.show{display:flex;}
.pos-modal{
  width:100%;max-height:85vh;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 16px 40px;
}
.pos-item{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:12px;
}
.pos-item-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.pos-item-symbol{font-size:16px;font-weight:700;}
.pos-item-pnl{font-size:20px;font-weight:700;}
.pos-item-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.pos-item-cell{background:var(--bg);border-radius:8px;padding:10px;}
.pos-item-label{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;}
.pos-item-value{font-size:14px;font-weight:700;}
.tp-cell{border:1px solid var(--green);}
.sl-cell{border:1px solid var(--red);}
.pos-chart-btn{
  width:100%;padding:12px;
  background:linear-gradient(135deg,#003399,#1a6aff);
  border:none;border-radius:10px;
  font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
  color:#fff;cursor:pointer;margin-bottom:8px;
}
.advice-box{
  border-radius:10px;padding:12px;margin-bottom:12px;
  font-size:13px;line-height:1.7;
}
.entry-row{
  display:flex;justify-content:space-between;
  padding:7px 0;border-bottom:1px solid var(--border);
  font-size:13px;
}
.entry-row:last-child{border-bottom:none;}
.entry-label{color:var(--muted);}
.entry-value{font-weight:700;}

/* ── PnL MODAL ── */
.pnl-result{border-radius:10px;padding:14px;text-align:center;margin-bottom:14px;}
.pnl-result-label{font-size:10px;letter-spacing:2px;font-weight:700;margin-bottom:6px;}
.pnl-result-value{font-size:28px;font-weight:700;}
.pnl-result-sub{font-size:11px;margin-top:4px;opacity:0.7;}

/* ── MT5ポジション ── */
.pos-banner{
  position:fixed;z-index:95;left:8px;right:8px;
  background:rgba(0,0,0,0.85);border-radius:8px;
  border:1px solid var(--border);
  padding:6px 12px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;
}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;}
.badge-buy{background:rgba(0,217,126,0.15);color:var(--green);border:1px solid var(--green);}
.badge-sell{background:rgba(255,77,106,0.15);color:var(--red);border:1px solid var(--red);}

/* ── LOADING ── */
.loading-overlay{
  display:none;position:absolute;inset:0;
  background:rgba(8,12,18,0.8);
  align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10;
}
.loading-overlay.show{display:flex;}
.loading-bars{display:flex;gap:4px;align-items:flex-end;}
.lb{width:4px;background:var(--gold);border-radius:2px;animation:bar 0.8s ease infinite alternate;}
@keyframes bar{from{height:8px;}to{height:24px;}}
.loading-text{font-size:10px;color:var(--gold);letter-spacing:3px;}

/* ── DOW BADGE ── */
.dow-badge{
  position:absolute;top:8px;left:8px;z-index:10;
  background:rgba(8,12,18,0.82);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px;pointer-events:none;
}
.dow-badge-trend{
  font-size:11px;font-weight:700;font-family:'Space Mono',monospace;
  letter-spacing:1px;
}
.dow-badge-sub{
  font-size:8px;color:var(--muted);margin-top:2px;
  font-family:'Space Mono',monospace;letter-spacing:0.5px;
}

/* ── TRADE PANEL ── */
.trade-panel{
  position:fixed;bottom:60px;left:0;right:0;z-index:95;
  background:var(--surface);border-top:1px solid var(--border);
  padding:8px 12px;
}
.trade-lot-row{
  display:flex;align-items:center;gap:6px;margin-bottom:8px;
}
.trade-lot-row label{font-size:9px;color:var(--muted);letter-spacing:1px;white-space:nowrap;}
.lot-preset{
  padding:5px 10px;background:var(--surface2);
  border:1px solid var(--border);border-radius:6px;
  font-family:'Space Mono',monospace;font-size:10px;
  color:var(--text);cursor:pointer;
}
.lot-preset.active{border-color:var(--gold);color:var(--gold);}
.margin-info{
  font-size:9px;color:var(--muted);letter-spacing:0.5px;
  text-align:center;margin-bottom:6px;
  font-family:'Space Mono',monospace;
}
.trade-btn-row{display:flex;gap:8px;}
.trade-btn{
  flex:1;padding:12px 8px;border:none;border-radius:10px;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  cursor:pointer;letter-spacing:1px;
}
.t-buy{background:linear-gradient(135deg,#006622,var(--green));color:#000;}
.t-sell{background:linear-gradient(135deg,#7a0020,var(--red));color:#fff;}
.t-close{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;font-family:'Space Mono',monospace;
  font-size:10px;color:var(--muted);cursor:pointer;padding:8px;
  display:none;
}
.t-close.show{display:block;}
/* 確認オーバーレイ */
.trd-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);
  z-index:700;align-items:flex-end;justify-content:center;
}
.trd-overlay.show{display:flex;}
.trd-modal{
  width:100%;background:var(--surface);
  border-radius:20px 20px 0 0;padding:24px 16px 40px;
}
.trd-modal h3{font-size:12px;color:var(--gold);letter-spacing:3px;text-align:center;margin-bottom:20px;}
.trd-modal .trd-info{font-size:14px;text-align:center;margin-bottom:6px;color:var(--text);}
.trd-modal .trd-price{font-size:28px;font-weight:700;text-align:center;margin-bottom:16px;}
.trd-tpsl-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.trd-tpsl-field{display:flex;flex-direction:column;gap:4px;}
.trd-tpsl-label{font-size:9px;color:var(--muted);letter-spacing:1px;}
.trd-tpsl-opt{font-size:8px;color:var(--border);margin-left:4px;}
.trd-tpsl-input{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:9px 10px;color:var(--text);
  font-family:'Space Mono',monospace;font-size:12px;outline:none;width:100%;
}
.trd-tpsl-input:focus{border-color:var(--gold);}
/* 注文タイプタブ（Bybitスタイル） */
.trd-type-row{
  display:flex;margin-bottom:14px;
  border-bottom:1px solid var(--border);
}
.trd-type-btn{
  flex:1;padding:8px 4px;background:transparent;
  border:none;border-bottom:2px solid transparent;
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
  color:var(--muted);cursor:pointer;letter-spacing:1px;
  margin-bottom:-1px;transition:color 0.15s,border-color 0.15s;
}
.trd-type-btn.active{border-bottom:2px solid var(--gold);color:var(--gold);}
.trd-limit-price-wrap{margin-bottom:12px;}
.trd-limit-price-label{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;}
.trd-limit-price-input{
  background:var(--bg);border:1px solid var(--gold);border-radius:8px;
  padding:9px 10px;color:var(--text);
  font-family:'Space Mono',monospace;font-size:13px;outline:none;width:100%;
}
.trd-limit-price-input:focus{border-color:var(--green);}
/* トースト */
.trd-toast{
  position:fixed;bottom:200px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.9);border:1px solid var(--border);
  border-radius:12px;padding:12px 24px;font-size:12px;
  color:var(--text);z-index:800;opacity:0;transition:opacity 0.3s;
  white-space:nowrap;
}
.trd-toast.show{opacity:1;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="brand">
    <div class="brand-dot"></div>
    <div class="brand-name">GOLD COPILOT</div>
  </div>
  <div class="header-right">
    <div>
      <div class="price-main" id="hdrPrice">---.--</div>
      <div class="price-change" id="hdrChange">XAUUSDs · MT5</div>
      <div id="hdrPct" style="font-size:10px;text-align:right;margin-top:2px;"></div>
    </div>
    <div class="mt5-badge" id="mt5Badge" onclick="openSettings()">
      <div class="mt5-dot"></div>
      <span id="mt5BadgeText">設定</span>
    </div>
  </div>
</div>

<!-- BALANCE BAR -->
<div class="balance-bar" id="balanceBar">
  <div class="bal-item"><div class="bal-label">残高</div><div class="bal-value" id="balVal">---</div></div>
  <div class="bal-item"><div class="bal-label">証拠金</div><div class="bal-value" id="equityVal">---</div></div>
  <div class="bal-item"><div class="bal-label">含み損益</div><div class="bal-value" id="pnlVal">¥0</div></div>
  <div class="bal-item" onclick="openPosModal()" style="cursor:pointer;"><div class="bal-label">ポジション ▶</div><div class="bal-value" id="posCount" style="color:var(--gold);">0件</div></div>
  <div class="bal-item" onclick="openHistModal()" style="cursor:pointer;"><div class="bal-label">履歴 ▶</div><div class="bal-value" id="histCount" style="color:var(--gold);">---</div></div>
</div>

<!-- TF BAR -->
<div class="tf-bar" id="tfBar">
  <button class="tf-btn" data-tf="1">M1</button>
  <button class="tf-btn" data-tf="5">M5</button>
  <button class="tf-btn active" data-tf="15">M15</button>
  <button class="tf-btn" data-tf="60">H1</button>
  <button class="tf-btn" data-tf="240">H4</button>
  <button class="tf-btn" data-tf="1D">D1</button>
  <button class="tf-btn" data-tf="1W">W1</button>
</div>

<!-- CHART -->
<div class="chart-area" id="chartArea">
  <canvas id="mainChart"></canvas>
  <div class="loading-overlay" id="chartLoading">
    <div class="loading-bars">
      <div class="lb" style="animation-delay:0s"></div>
      <div class="lb" style="animation-delay:0.15s"></div>
      <div class="lb" style="animation-delay:0.3s"></div>
      <div class="lb" style="animation-delay:0.45s"></div>
    </div>
    <div class="loading-text">LOADING...</div>
  </div>
  <!-- ダウ理論バッジ -->
  <div class="dow-badge" id="dowBadge">
    <div class="dow-badge-trend" id="dowBadgeTrend" style="color:var(--muted);">DOW --</div>
    <div class="dow-badge-sub" id="dowBadgeSub">スウィング分析中</div>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="pnl-btn" onclick="openPnL()">損益<br>計算</button>
  <button class="analyze-btn" id="analyzeBtn">⚡ AI分析する</button>
</div>

<!-- 設定モーダル -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">接続設定</div>
    <div class="m-field">
      <label>TwelveData API Key</label>
      <input type="password" id="twelveKey" placeholder="リアルタイム価格用">

async function loadChart(tf) {

  if(MT5_TOKEN && MT5_ACCOUNT_ID && mt5Connected) {

    candles = await fetchTwelveData(tf, count);
    if(candles && candles.length) source = 'TwelveData';
  }

  // デモデータ
  if(!candles || !candles.length) {
    candles = generateDemo(tf, count);
    source = 'DEMO';
  }

  chartData = candles;
  console.log('[loadChart] currentTf:', tf, '| source:', source, '| chartData 最初の3本:', chartData.slice(0,3).map(function(c){
    return {t:new Date(c.t).toISOString(), o:c.o, h:c.h, l:c.l, c:c.c};
  }));
  document.getElementById('hdrChange').textContent = 'XAUUSDs · ' + source;
  buildChart(candles, overlayLines.concat(entryLines));
  updateHeaderFromCandles(candles);
  document.getElementById('chartLoading').classList.remove('show');

}

// ══ METAAPI CANDLES ══
async function fetchMetaApiCandles(tf, count) {
  var tfMap = {'1':'1m','5':'5m','15':'15m','60':'1h','240':'4h','1D':'1d','1W':'1w'};
  var timeframe = tfMap[tf] || '15m';
  var secMap = {'1':60,'5':300,'15':900,'60':3600,'240':14400,'1D':86400,'1W':604800};
  var tfMs = (secMap[tf] || 900) * 1000;
  var startTime = new Date(Date.now() - count * tfMs * 2).toISOString();
  var headers = {'auth-token': MT5_TOKEN};

  // ① 過去データ（複数本）
  var histUrl = 'https://mt-market-data-client-api-v1.london.agiliumtrade.ai/users/current/accounts/'
    + MT5_ACCOUNT_ID + '/historical-market-data/symbols/XAUUSDs/timeframes/'
    + timeframe + '/candles?startTime=' + encodeURIComponent(startTime) + '&limit=' + count;
  console.log('[MetaApi] 過去データURL:', histUrl);

  // ② 現在のローソク足（1本）
  var currentUrl = 'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/'
    + MT5_ACCOUNT_ID + '/symbols/XAUUSDs/current-candles/' + timeframe;
  console.log('[MetaApi] 現在足URL:', currentUrl);

  try {
    // ①と②を並列取得
    var [histRes, currentRes] = await Promise.all([
      fetch(histUrl, {headers: headers}),
      fetch(currentUrl, {headers: headers})
    ]);

    if(!histRes.ok) {
      console.log('[MetaApi] 過去データ status:', histRes.status, await histRes.text());
      return null;
    }
    var histData = await histRes.json();
    if(!Array.isArray(histData) || !histData.length) return null;
    console.log('[MetaApi] 取得件数:', histData.length, '最初:', histData[0].brokerTime, '最後:', histData[histData.length-1].brokerTime);

    // ①をマッピング
    var mapped = histData.map(function(v){
      return {t: new Date(v.time).getTime(), bt: v.brokerTime, o: +v.open, h: +v.high, l: +v.low, c: +v.close};
    }).sort(function(a,b){return a.t-b.t;}).slice(-count);

    // ②の現在足を末尾に追加
    if(currentRes.ok) {
      var cur = await currentRes.json();
      console.log('[MetaApi] 現在足:', JSON.stringify(cur));
      if(cur && cur.open != null) {
        var curCandle = {t: new Date(cur.time).getTime(), bt: cur.brokerTime, o: +cur.open, h: +cur.high, l: +cur.low, c: +cur.close, isPartial: true};
        // 同じ時刻の足が既にあれば置き換え、なければ追加
        var last = mapped[mapped.length-1];
        if(last && last.t === curCandle.t) {
          mapped[mapped.length-1] = curCandle;
        } else {
          mapped.push(curCandle);
        }
        console.log('[MetaApi] 現在足を追加:', new Date(curCandle.t).toISOString(), 'o:', curCandle.o, 'h:', curCandle.h, 'l:', curCandle.l, 'c:', curCandle.c);
      }
    } else {
      console.log('[MetaApi] 現在足 status:', currentRes.status, await currentRes.text());
    }

    // ── mapped 整合チェック（GC_DEBUG 時のみ） ──
    if(window.GC_DEBUG && mapped.length){
      // 先頭・末尾サマリー
      gcDebugMappedSummary(mapped);

      // 主チェック：隣接バーの時系列整合
      // チェック1: t が昇順であること
      // チェック2: bt 文字列が逆転していないこと
      // ※ brokerTime を Date parse して UTC 変換する処理は行わない
      var tWarnCount  = 0;
      var btWarnCount = 0;

      for(var _mi = 1; _mi < mapped.length; _mi++){
        var prev = mapped[_mi - 1];
        var cur  = mapped[_mi];

        // チェック1: t 昇順
        if(cur.t <= prev.t){
          console.warn('[mapped] t逆転 index=' + _mi
            + ' prev.t=' + prev.t
            + ' cur.t='  + cur.t
            + ' prev.bt="' + prev.bt + '"'
            + ' cur.bt="'  + cur.bt  + '"');
          tWarnCount++;
        }

        // チェック2: bt 文字列逆転なし（文字列の辞書順比較）
        // brokerTime は "YYYY-MM-DD HH:mm:ss.sss" 形式のため
        // 辞書順 = 時系列順になる。UTC変換は行わない。
        if(prev.bt && cur.bt){
          var prevBtStr = prev.bt.toString();
          var curBtStr  = cur.bt.toString();
          if(curBtStr <= prevBtStr){
            console.warn('[mapped] bt文字列逆転 index=' + _mi
              + ' prev.bt="' + prevBtStr + '"'
              + ' cur.bt="'  + curBtStr  + '"');
            btWarnCount++;
          }
        }

        // 追加チェック: btRaw の日付部分が飛びすぎていないか（文字列比較のみ）
        // "YYYY-MM-DD HH:mm:ss" の先頭10文字（日付部分）を比較。
        // 隣接バーで日付が2日以上飛んでいる場合のみ warning。
        // Date parse・UTC変換は一切行わない。
        if(prev.bt && cur.bt){
          var prevDate = prev.bt.toString().slice(0, 10);
          var curDate  = cur.bt.toString().slice(0, 10);
          if(prevDate && curDate && prevDate.length === 10 && curDate.length === 10){
            // 文字列として "YYYY-MM-DD" 形式なら辞書順 = 日付順
            // curDate が prevDate より2日以上後なら gap 警告
            // 厳密な日数計算はせず、文字列の差が大きい場合のみ検出
            if(curDate > prevDate){
              // prevDate と curDate の差を簡易チェック（月・日の文字列比較）
              // 例: "2026-03-27" → "2026-03-29" で2日差
              // ここでは年月が同じで日が2以上離れている場合のみ警告
              var prevD = prevDate.slice(8, 10);
              var curD  = curDate.slice(8, 10);
              var prevM = prevDate.slice(5, 7);
              var curM  = curDate.slice(5, 7);
              var dayGap = (curM === prevM)
                ? (parseInt(curD, 10) - parseInt(prevD, 10))
                : 999; // 月をまたぐ場合は gap ありとみなす
              if(dayGap >= 2){
                console.warn('[mapped] btRaw の日付が ' + dayGap + '日以上飛んでいます'
                  + ' index=' + _mi
                  + ' prev.bt="' + prev.bt + '"'
                  + ' cur.bt="'  + cur.bt  + '"');
              }
            }
          }
        }
      }

      if(tWarnCount === 0 && btWarnCount === 0){
        console.log('[mapped] 整合チェック OK（' + mapped.length + '本、'
          + 't昇順・bt文字列逆転なし）');
      }

      // 各バーの詳細出力（比較しやすい1行形式）
      console.group('[mapped] 全バー詳細');
      mapped.forEach(function(m, idx){
        console.log(
          'i=' + String(idx).padStart(3, ' ')
          + '  t='        + m.t
          + '  bt="'      + m.bt      + '"'
          + '  btLabel="' + m.btLabel + '"'
          + '  O=' + m.o.toFixed(2)
          + ' H=' + m.h.toFixed(2)
          + ' L=' + m.l.toFixed(2)
          + ' C=' + m.c.toFixed(2)
        );
      });
      console.groupEnd();
    }

    console.log('[MetaApi] 取得件数:', mapped.length,
      '先頭bt:', mapped[0]?.bt,
      '末尾bt:', mapped[mapped.length-1]?.bt);
    return mapped;
  } catch(e) { console.log('[MetaApi] catch error:', e); return null; }
}

// ══ TWELVEDATA ══
async function fetchTwelveData(tf, count) {
  var ivMap = {'1':'1min','5':'5min','15':'15min','60':'1h','240':'4h','1D':'1day','1W':'1week'};
  var url = 'https://api.twelvedata.com/time_series?symbol=XAU/USD&interval='
    + (ivMap[tf]||'15min') + '&outputsize=' + count + '&apikey=' + TWELVE_KEY;
  try {
    var res = await fetch(url);
    var data = await res.json();
    if(data.status==='error'||!data.values) return null;
    return data.values.slice().reverse().map(function(v){
      return {t:new Date(v.datetime).getTime(),o:+v.open,h:+v.high,l:+v.low,c:+v.close};
    });
  } catch(e) { return null; }
}

// ══ DEMO DATA ══
function generateDemo(tf, count) {
  var base = 2650 + Math.random()*80;
  var sec = {'1':60,'5':300,'15':900,'60':3600,'240':14400,'1D':86400,'1W':604800}[tf]||900;
  var now = Date.now();
  return Array.from({length:count},function(_,i){
    var vol = 5+Math.random()*15, o = base;
    var c = o+(Math.random()-0.49)*vol;
    var h = Math.max(o,c)+Math.random()*vol*0.5;
    var l = Math.min(o,c)-Math.random()*vol*0.5;
    base = c;
    return {t:now-(count-1-i)*sec*1000, o:+o.toFixed(2), h:+h.toFixed(2), l:+l.toFixed(2), c:+c.toFixed(2)};
  });
}

var _cv = { candles:[], lines:[], vMin:0, vMax:0, yMin:0, yMax:0 };

function calcMA(data, p) {
  return data.map(function(_,i){
    if(i<p-1) return null;
    return data.slice(i-p+1,i+1).reduce(function(a,b){return a+b;},0)/p;
  });
}

function _fitY(i0, i1) {
  var n = _cv.candles.length;
  i0 = Math.max(0, Math.floor(i0));
  i1 = Math.min(n - 1, Math.ceil(i1));
  var lo = Infinity, hi = -Infinity;
  for(var i = i0; i <= i1; i++){
    var c = _cv.candles[i];
    if(!c || c.l <= 100) continue;
    if(c.l < lo) lo = c.l;
    if(c.h > hi) hi = c.h;
  }
  if(!isFinite(lo)) return;
  var range = (hi - lo) || 1;
  _cv.yMin = lo - range * 0.05;
  _cv.yMax = hi + range * 0.05;
}
function _calcMAArr(candles, period){
  var n = candles.length;
  var result = new Array(n);
  var sums = new Array(n + 1);
  sums[0] = 0;
  for(var i = 0; i < n; i++) sums[i+1] = sums[i] + candles[i].c;
  for(var i = 0; i < n; i++){
    if(i < period - 1){ result[i] = null; continue; }
    result[i] = (sums[i+1] - sums[i - period + 1]) / period;
  }
  return result;
}
function getInitialVisibleCount(tf) {
  var map = {'1':80,'5':70,'15':50,'60':40,'240':30,'1D':30,'1W':26};
  return map[tf] || 50;
}
function resetViewportToLatest() {
  if(!_cv.candles.length) return;
  var n = _cv.candles.length;
  var visibleCount = getInitialVisibleCount(currentTf);
  var i1 = n - 1;
  var i0 = Math.max(0, i1 - visibleCount + 1);
  _cv.vMin = i0;
  _cv.vMax = i1;
  _fitY(i0, i1);
  console.log('[resetViewportToLatest] i0:', i0, 'i1:', i1, 'visibleCount:', visibleCount,
    'visible先頭bt:', _cv.candles[i0] ? _cv.candles[i0].bt : '--',
    'visible末尾bt:', _cv.candles[i1] ? _cv.candles[i1].bt : '--');
}
function buildChart(candles, lines) {
  console.log('[buildChart] candles:', candles.length,
    '先頭bt:', candles[0]?.bt,
    '末尾bt:', candles[candles.length-1]?.bt);
  followLatest = true;
  _cv.candles = candles;
  _cv.lines   = lines || [];
  resetViewportToLatest();
  _cv.ma20 = _calcMAArr(candles, 20);
  _cv.ma50 = _calcMAArr(candles, 50);
  chartInstance = {
    update:  function(){ redrawChart(); },
    destroy: function(){},
    resize:  function(){ redrawChart(); },
    scales: {
      x: {
        min: 0, max: candles.length - 1,
        getPixelForValue: function(v){
          var canvas = document.getElementById('mainChart');
          if(!canvas) return 0;
          var dpr = window.devicePixelRatio || 1;
          var W = canvas.width / dpr;
          var plotW = W - 8 - 64;
          if(_cv.vMax <= _cv.vMin) return 0;
          return 8 + (v - _cv.vMin) / (_cv.vMax - _cv.vMin) * plotW;
        }
      },
      y: {
        top: 8, bottom: 0,
        getPixelForValue: function(p){
          var canvas = document.getElementById('mainChart');
          if(!canvas) return 0;
          var dpr = window.devicePixelRatio || 1;
          var H = canvas.height / dpr;
          var plotH = H - 8 - 36;
          if(_cv.yMax <= _cv.yMin) return 0;
          return 8 + (1 - (p - _cv.yMin) / (_cv.yMax - _cv.yMin)) * plotH;
        }
      }
    }
  };
  redrawChart();
  updateDowBadge(calcDowTheory(candles));
}
// X軸ラベル用ヘルパー
// bt 例: "2026.03.28 10:15:00"
function _parseBt(bt) {
  if(!bt) return null;
  var s = bt.toString();
  var parts = s.split(' ');
  if(parts.length < 2) return null;
  var dateParts = parts[0].split('-');
  var timeParts = parts[1].split(':');
  if(dateParts.length < 3 || timeParts.length < 2) return null;
  return {
    mo: parseInt(dateParts[1], 10),
    d:  parseInt(dateParts[2], 10),
    h:  parseInt(timeParts[0], 10),
    mi: parseInt(timeParts[1], 10)
  };
}
function _makeXLabel(c, prevC, tf, ppc) {
  // ppc = pixelsPerCandle
  var cur = _parseBt(c.bt);
  if(!cur) {
    // bt なし: t(unix ms) から UTC フォールバック
    var d = new Date(c.t);
    return (d.getUTCMonth()+1).toString().padStart(2,'0') + '/'
         + d.getUTCDate().toString().padStart(2,'0') + ' '
         + d.getUTCHours().toString().padStart(2,'0') + ':'
         + d.getUTCMinutes().toString().padStart(2,'0');
  }
  var prv = prevC ? _parseBt(prevC.bt) : null;
  var isNewDay = !prv || prv.d !== cur.d;
  var hh = cur.h.toString().padStart(2,'0');
  var mm = cur.mi.toString().padStart(2,'0');
  if(tf === '1') {
    if(isNewDay)             return cur.mo + '/' + cur.d;
    if(ppc >= 20)            return hh + ':' + mm;          // 毎足
    if(ppc >= 8  && cur.mi % 5  === 0) return hh + ':' + mm; // 5分
    if(ppc >= 4  && cur.mi % 15 === 0) return hh + ':' + mm; // 15分
    if(cur.mi % 30 === 0)    return hh + ':' + mm;          // 30分
    return null;
  }
  if(tf === '5') {
    if(isNewDay)             return cur.mo + '/' + cur.d;
    if(ppc >= 20)            return hh + ':' + mm;          // 毎足(5分)
    if(ppc >= 8  && cur.mi % 15 === 0) return hh + ':' + mm; // 15分
    if(ppc >= 4  && cur.mi % 30 === 0) return hh + ':' + mm; // 30分
    if(cur.mi === 0)         return hh + ':00';             // 1時間
    return null;
  }
  if(tf === '15') {
    if(isNewDay)             return cur.mo + '/' + cur.d;
    if(ppc >= 20)            return hh + ':' + mm;          // 毎足(15分)
    if(ppc >= 8  && cur.mi === 0)              return hh + ':00'; // 1時間
    if(cur.h % 3 === 0 && cur.mi === 0)        return hh + ':00'; // 3時間
    return null;
  }
  if(tf === '60') {
    if(isNewDay)             return cur.mo + '/' + cur.d;
    if(ppc >= 20)            return hh + ':00';             // 毎足(1時間)
    if(ppc >= 8  && cur.h % 4 === 0) return hh + ':00';    // 4時間
    return null;                                            // それ以下は日付境界のみ
  }
  if(tf === '240') {
    // H4: 日付境界→M/D のみ
    if(isNewDay) return cur.mo + '/' + cur.d;
    return null;
  }
  // D1/W1: 常に M/D
  return cur.mo + '/' + cur.d;
}
// 未確定足判定：bar.isPartial フラグを参照する
// fetchMetaApiCandles / refreshCurrentCandleFromAPI で設定される
function _isUnconfirmed(idx, n){
  return !!(_cv.candles[idx] && _cv.candles[idx].isPartial);
}
function redrawChart() {
  var canvas = document.getElementById('mainChart');
  if(!canvas || !_cv.candles || !_cv.candles.length) return;

  var dpr = window.devicePixelRatio || 1;
  var W   = canvas.width  / dpr;
  var H   = canvas.height / dpr;
  var ctx = canvas.getContext('2d');

  var padL=8, padR=64, padT=8, padB=36;
  var plotW = W - padL - padR;
  var plotH = H - padT - padB;
  if(plotW <= 0 || plotH <= 0) return;

  var candles = _cv.candles;
  var n       = candles.length;
  var vMin    = _cv.vMin, vMax = _cv.vMax;
  var yMin    = _cv.yMin, yMax = _cv.yMax;
  if(vMax <= vMin || yMax <= yMin) return;

  var i0 = Math.max(0,     Math.floor(vMin));
  var i1 = Math.min(n - 1, Math.ceil(vMax));
  var visibleCount = vMax - vMin + 1;

  if(window.GC_DEBUG) console.log('[redrawChart] i0:', i0, 'i1:', i1,
    'visibleCount:', visibleCount,
    'visible先頭bt:', candles[i0]?.bt,
    'visible末尾bt:', candles[i1]?.bt,
    'tf:', currentTf, 'mt5Bid:', mt5Bid);

  function xOf(idx){ return padL + (idx - vMin) / (vMax - vMin) * plotW; }
  function yOf(p)  { return padT + (1 - (p - yMin) / (yMax - yMin)) * plotH; }
  function pxX(v)  { return Math.floor(v) + 0.5; }
  function pxY(v)  { return Math.floor(v) + 0.5; }

  // 高DPI対応
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 背景
  ctx.fillStyle = '#080c12';
  ctx.fillRect(0, 0, W, H);

  // Y軸ティック（niceStep）
  function niceStep(range, targetCount){
    if(range <= 0 || targetCount <= 0) return 1;
    var rough = range / targetCount;
    if(rough <= 0) return 1;
    var mag  = Math.pow(10, Math.floor(Math.log(rough) / Math.LN10));
    if(!isFinite(mag) || mag <= 0) return 1;
    var norm = rough / mag;
    var nice;
    if     (norm < 1.5) nice = 1;
    else if(norm < 3)   nice = 2;
    else if(norm < 7)   nice = 5;
    else                nice = 10;
    return nice * mag;
  }
  var yRange = yMax - yMin;
  var yStep  = niceStep(yRange, 6);
  var yStart = Math.ceil(yMin / yStep) * yStep;

  ctx.strokeStyle = 'rgba(30,45,68,0.6)';
  ctx.lineWidth   = 1;
  ctx.setLineDash([]);
  ctx.fillStyle   = '#4a6080';
  ctx.font        = '9px Space Mono, monospace';
  ctx.textAlign   = 'left';
  for(var gp = yStart; gp <= yMax + yStep * 0.01; gp += yStep){
    var gy = pxY(yOf(gp));
    if(gy < padT || gy > padT + plotH) continue;
    ctx.beginPath();
    ctx.moveTo(padL,         gy);
    ctx.lineTo(padL + plotW, gy);
    ctx.stroke();
    ctx.fillText(gp.toFixed(2), padL + plotW + 4, gy + 3);
  }

  // MAライン（buildChartでキャッシュ済み）
  function drawMALine(arr, color){
    if(!arr) return;
    ctx.strokeStyle = color;
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    var started = false;
    for(var mi = i0; mi <= i1; mi++){
      if(arr[mi] === null || arr[mi] === undefined){ started = false; continue; }
      var mx = xOf(mi), my = yOf(arr[mi]);
      if(!started){ ctx.moveTo(mx, my); started = true; }
      else          ctx.lineTo(mx, my);
    }
    ctx.stroke();
  }
  drawMALine(_cv.ma20, '#f0b429');
  drawMALine(_cv.ma50, '#3d8bff');

  // S/Rオーバーレイライン
  (_cv.lines || []).forEach(function(l){
    if(!l || !l.price || l.price < 1000 || l.price > 100000) return;
    var ly = pxY(yOf(l.price));
    if(ly < padT || ly > padT + plotH) return;
    ctx.strokeStyle = l.color || '#f0b429';
    ctx.lineWidth   = l.width || 1.5;
    ctx.setLineDash(l.dash  || []);
    ctx.beginPath();
    ctx.moveTo(padL,         ly);
    ctx.lineTo(padL + plotW, ly);
    ctx.stroke();
    ctx.setLineDash([]);
    if(l.label){
      ctx.font = '10px Space Mono, monospace';
      var lw = ctx.measureText(l.label).width;
      ctx.fillStyle = 'rgba(8,12,18,0.8)';
      ctx.fillRect(padL + 4, ly - 13, lw + 8, 13);
      ctx.fillStyle = l.color || '#f0b429';
      ctx.textAlign = 'left';
      ctx.fillText(l.label, padL + 8, ly - 2);
    }
  });

  // ローソク足（ヒゲ→実体の順）
  var candleW = Math.min(
    Math.max(1, plotW / visibleCount * 0.6),
    40
  );
  for(var ci = i0; ci <= i1; ci++){
    var c = candles[ci];
    if(!c) continue;
    var isBull        = c.c >= c.o;
    var isUnconfirmed = _isUnconfirmed(ci, n);
    var baseCol = isBull ? '#00d97e' : '#ff4d6a';
    var col = isUnconfirmed
      ? (isBull ? 'rgba(0,217,126,0.45)' : 'rgba(255,77,106,0.45)')
      : baseCol;

    // ヒゲ：X・Y ともに 0.5px 補正でシャープに
    ctx.strokeStyle = col;
    ctx.lineWidth   = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(pxX(xOf(ci)), pxY(yOf(c.h)));
    ctx.lineTo(pxX(xOf(ci)), pxY(yOf(c.l)));
    ctx.stroke();

    // 実体
    var bTop = yOf(Math.max(c.o, c.c));
    var bBot = yOf(Math.min(c.o, c.c));
    var bH   = Math.max(1, bBot - bTop);
    ctx.fillStyle = col;
    ctx.fillRect(
      Math.round(xOf(ci) - candleW / 2),
      Math.round(bTop),
      Math.round(candleW),
      Math.round(bH)
    );
  }

  // X軸ラベル（TF別ルール + ズームレベル + 最小ピクセル間隔で間引き）
  // X座標はindexベースを維持。bt は UTC変換せずそのままパース。
  ctx.fillStyle = '#a0c0e0';
  ctx.font      = '11px Space Mono, monospace';
  ctx.textAlign = 'center';
  var MIN_LABEL_PX = 52;
  var pixelsPerCandle = plotW / visibleCount;
  // 1パス: TFルール+ズームレベルでラベル候補を収集
  var _lblCands = [];
  for(var xi = i0; xi <= i1; xi++){
    var xc = candles[xi];
    if(!xc) continue;
    var _lbl = _makeXLabel(xc, xi > 0 ? candles[xi-1] : null, currentTf, pixelsPerCandle);
    if(_lbl) _lblCands.push({px: xOf(xi), label: _lbl});
  }
  // 2パス: 最小ピクセル間隔で間引いて描画
  var _lastPx = -Infinity;
  for(var li = 0; li < _lblCands.length; li++){
    if(_lblCands[li].px - _lastPx < MIN_LABEL_PX) continue;
    ctx.fillText(_lblCands[li].label, _lblCands[li].px, padT + plotH + 24);
    _lastPx = _lblCands[li].px;
  }

  // 現在価格ライン（MetaApi bid のみ）
  if(mt5Bid > 0){
    var lpy = pxY(yOf(mt5Bid));
    if(lpy >= padT && lpy <= padT + plotH){
      ctx.strokeStyle = 'rgba(232,240,255,0.8)';
      ctx.lineWidth   = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(padL,         lpy);
      ctx.lineTo(padL + plotW, lpy);
      ctx.stroke();
      ctx.setLineDash([]);
      var priceStr = mt5Bid.toFixed(2);
      ctx.font = '9px Space Mono, monospace';
      var plw  = ctx.measureText(priceStr).width;
      ctx.fillStyle = '#e8f0ff';
      ctx.fillRect(padL + plotW + 2, lpy - 8, plw + 8, 16);
      ctx.fillStyle = '#080c12';
      ctx.textAlign = 'left';
      ctx.fillText(priceStr, padL + plotW + 6, lpy + 4);
    }
  }

  // 約定マーク
  // deal.time（UTC ISO）を時間解釈の主軸にする
  // deal.brokerTime はローカル時間文字列のため UTC 解釈しない
  if(tradeMarks && tradeMarks.length){
    tradeMarks.forEach(function(deal){
      var dealTime = deal.time ? new Date(deal.time).getTime() : NaN;
      if(isNaN(dealTime)) return;
      var closestIdx = -1, minDiff = Infinity;
      for(var di = i0; di <= i1; di++){
        var diff = Math.abs(candles[di].t - dealTime);
        if(diff < minDiff){ minDiff = diff; closestIdx = di; }
      }
      if(closestIdx < 0) return;
      var dxPos  = xOf(closestIdx);
      var dPrice = parseFloat(deal.price || 0);
      if(dPrice <= 0) return;
      var dyPos = yOf(dPrice);
      if(dyPos < padT || dyPos > padT + plotH) return;
      ctx.font      = 'bold 12px Space Mono, monospace';
      ctx.textAlign = 'center';
      if(deal.type === 'DEAL_TYPE_BUY'){
        ctx.fillStyle = '#00d97e';
        ctx.fillText('▲', dxPos, dyPos + 18);
        ctx.font = '8px Space Mono, monospace';
        ctx.fillText(dPrice.toFixed(0), dxPos, dyPos + 28);
      } else {
        ctx.fillStyle = '#ff4d6a';
        ctx.fillText('▽', dxPos, dyPos - 8);
        ctx.font = '8px Space Mono, monospace';
        ctx.fillText(dPrice.toFixed(0), dxPos, dyPos - 18);
      }
    });
  }

  // デバッグ出力（window.GC_DEBUG = true で有効）
  if(window.GC_DEBUG){
    console.group('redrawChart i0=' + i0 + ' i1=' + i1
      + ' yMin=' + _cv.yMin.toFixed(2) + ' yMax=' + _cv.yMax.toFixed(2)
      + ' visibleCount=' + visibleCount);
    for(var di = i0; di <= i1; di++){
      var dc = candles[di];
      if(!dc) continue;
      var assumedUnconfirmed = _isUnconfirmed(di, n);
      console.log(
        'i=' + String(di).padStart(3,' ')
        + (assumedUnconfirmed ? ' [未確定★暫定]' : ' [確定済み]')
        + '  t='        + dc.t
        + '  bt="'      + dc.bt      + '"'
        + '  btLabel="' + (dc.btLabel||'') + '"'
        + '  O=' + dc.o.toFixed(2)
        + ' H=' + dc.h.toFixed(2)
        + ' L=' + dc.l.toFixed(2)
        + ' C=' + dc.c.toFixed(2)
        + '  x='  + Math.round(xOf(di))
        + ' yO='  + Math.round(yOf(dc.o))
        + ' yH='  + Math.round(yOf(dc.h))
        + ' yL='  + Math.round(yOf(dc.l))
        + ' yC='  + Math.round(yOf(dc.c))
      );
    }
    console.groupEnd();
  }
}

// ══ HEADER PRICE ══
function updateHeaderFromCandles(candles) {
  if(!candles.length) return;
  var last = candles[candles.length-1];
  var first = candles[0];
  dayOpenPrice = first.o;
  chartLastClose = last.c;
  headerPrice = last.c;
  document.getElementById('hdrPrice').textContent = last.c.toFixed(2);
  updateHdrPct(last.c);
}

function updateHdrPct(price) {
  var el = document.getElementById('hdrPct');
  if(!el) return;
  if(!dayOpenPrice || dayOpenPrice <= 0) return;
  var pct = (price - dayOpenPrice) / dayOpenPrice * 100;
  var sign = pct >= 0 ? '+' : '';
  el.textContent = sign + pct.toFixed(2) + '%';
  el.className = pct >= 0 ? 'positive' : 'negative';
}

function updateMarginInfo() {
  var lot = parseFloat(document.getElementById('lotInput').value) || 0.01;
  var price = mt5Bid || chartLastClose || 0;
  var req = price > 0 ? Math.round(lot * price * USD_JPY) : 0;
  var avail = mt5Equity > 0 ? Math.round(mt5Equity) : 0;
  var el = document.getElementById('marginInfo');
  el.textContent = req > 0
    ? '必要証拠金: ¥' + req.toLocaleString() + ' | 利用可能: ¥' + avail.toLocaleString()
    : '必要証拠金: --- | 利用可能: ' + (avail > 0 ? '¥' + avail.toLocaleString() : '---');
}

function updateLivePrice(price) {
  if(price<=0) return;
  var prev = headerPrice;
  headerPrice = price;
  var el = document.getElementById('hdrPrice');
  el.textContent = price.toFixed(2);
  if(prev>0){
    var diff = price-prev;
    el.style.color = diff>=0?'var(--green)':'var(--red)';
    setTimeout(function(){el.style.color='';},400);
  }
  updateHdrPct(price);
  updateMarginInfo();
  // MT5ポジションの損益再計算
  if(mt5Positions.length>0) refreshPositionPnL(price);
}

function showSettingsStatus(msg, type){
  var el = document.getElementById('settingsStatus');
  el.style.display='block';
  el.style.background = type==='ok'?'rgba(0,217,126,0.1)':type==='err'?'rgba(255,77,106,0.1)':'rgba(240,180,41,0.1)';

function connectFinnhubWS() {
  if(!FINNHUB_KEY) return;
  if(tdWs) { tdWs.onclose = null; tdWs.close(); }

  tdWs = new WebSocket('wss://ws.finnhub.io?token=' + FINNHUB_KEY);

  tdWs.onopen = function() {
    tdWsConnected = true;
    console.log('Finnhub WS接続成功');
    tdWs.send(JSON.stringify({type: 'subscribe', symbol: 'OANDA:XAU_USD'}));
    tdWs.send(JSON.stringify({type: 'subscribe', symbol: 'FXCM:XAUUSD'}));
  };

  tdWs.onmessage = function(e) {
    try {
      var msg = JSON.parse(e.data);
      console.log('Finnhub受信:', JSON.stringify(msg).slice(0,100));

      // typeがtradeまたはtypeなしのdataがある場合
      if(msg.data && msg.data.length) {
        var latestTrade = msg.data[msg.data.length - 1];
        var price = parseFloat(latestTrade.p);
        if(price > 0) {
          updateLivePrice(price);
          // Finnhubはヘッダー参考価格のみ。チャート更新・未確定足・bid表示はMetaApi側で管理
        }
      }
    } catch(err) {
      console.error('Finnhub parse error:', err);
    }
  };

  tdWs.onclose = function() {
    tdWsConnected = false;
    if(mt5Connected) {
      console.log('Finnhub WS切断・5秒後再接続');
      setTimeout(connectFinnhubWS, 5000);
    }
  };

  tdWs.onerror = function() { tdWsConnected = false; };
}

// 未確定足をMetaApi current-candle で更新する
// fetchMT5Data（10秒毎）から呼ばれる。Finnhubは使わない。
async function refreshCurrentCandleFromAPI() {
  if(!MT5_TOKEN || !MT5_ACCOUNT_ID || !chartData.length) return;
  var tfMap    = {'1':'1m','5':'5m','15':'15m','60':'1h','240':'4h','1D':'1d','1W':'1w'};
  var tfMsMap  = {'1':60000,'5':300000,'15':900000,'60':3600000,'240':14400000,'1D':86400000,'1W':604800000};
  var timeframe = tfMap[currentTf];
  var tfMs      = tfMsMap[currentTf];
  if(!timeframe || !tfMs) return;

  // API失敗時は chartData を変更せず warn のみ
  var r;
  try {
    r = await fetch(
      'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/'+MT5_ACCOUNT_ID+'/symbols/XAUUSDs/current-candles/'+timeframe,
      {headers:{'auth-token':MT5_TOKEN}});
  } catch(e){
    console.warn('[refreshCurrentCandle] fetch失敗:', e);
    return;
  }
  if(!r.ok){
    console.warn('[refreshCurrentCandle] HTTP', r.status);
    return;
  }
  var cur;
  try { cur = await r.json(); } catch(e){
    console.warn('[refreshCurrentCandle] JSON parse失敗:', e);
    return;
  }
  if(!cur || cur.open == null){
    console.warn('[refreshCurrentCandle] レスポンスが不正:', cur);
    return;
  }

  // 同一足判定：時間足ミリ秒で正規化した値で比較
  var curNorm  = Math.floor(Date.parse(cur.time) / tfMs) * tfMs;
  var last     = chartData[chartData.length - 1];
  var lastNorm = Math.floor(last.t / tfMs) * tfMs;

  // ギャップ検出：1本以上ギャップがあれば全体再取得
  if(curNorm - lastNorm > tfMs){
    gcDebugGapCount++;
    console.warn('[refreshCurrentCandle] ギャップ検出 lastNorm='+lastNorm+' curNorm='+curNorm+' diff='+(curNorm-lastNorm)/tfMs+'本 → loadChart再実行');
    loadChart(currentTf);
    return;
  }

  var curCandle = {t: curNorm, bt: cur.brokerTime,
    o: +cur.open, h: +cur.high, l: +cur.low, c: +cur.close, isPartial: true};

  if(curNorm === lastNorm) {
    // 同じ足を更新（isPartial 維持）
    last.o = curCandle.o; last.h = curCandle.h;
    last.l = curCandle.l; last.c = curCandle.c;
    last.isPartial = true;
  } else if(curNorm > lastNorm) {
    // 新足開始：前の足を確定化してから追加
    delete last.isPartial;
    console.log('BAR_CONFIRMED', {
      bt: last.bt,
      o: last.o,
      h: last.h,
      l: last.l,
      c: last.c
    });
    chartData.push(curCandle);
    _cv.candles = chartData;
    // 確定足が増えたタイミングでのみダウ理論バッジを更新
    updateDowBadge(calcDowTheory(chartData));
  }

  // isPartial の一意性保証：末尾以外はすべて false に
  for(var _pi = 0; _pi < chartData.length - 1; _pi++){
    if(chartData[_pi].isPartial) chartData[_pi].isPartial = false;
  }

  if(followLatest) {
    resetViewportToLatest();
  } else if(_cv.vMax >= _cv.candles.length - 2) {
    _cv.vMax = _cv.candles.length - 1;
    _fitY(_cv.vMin, _cv.vMax);
  }
  gcDebugLastSync = Date.now();
  gcDebugLog();
  scheduleChartUpdate();
}

      // BUYの場合: tp = entryより上、sl = entryより下
      var rawTp = analysisResult.tp;
      var rawSl = analysisResult.sl;
      if(isBuy){
        tp = rawTp > p.openPrice ? rawTp : rawSl > p.openPrice ? rawSl : null;
        sl = rawSl < p.openPrice ? rawSl : rawTp < p.openPrice ? rawTp : null;

        tp = rawTp < p.openPrice ? rawTp : rawSl < p.openPrice ? rawSl : null;
        sl = rawSl > p.openPrice ? rawSl : rawTp > p.openPrice ? rawTp : null;
      }
      if(tp) tpPnl = Math.round(Math.abs(tp - p.openPrice) * (p.volume||0.01) * 100 * USD_JPY);

var positionHistory = [];

async function fetchPositionHistory(){
  if(!MT5_TOKEN || !MT5_ACCOUNT_ID) return;
  var endTime = new Date().toISOString();
  var startTime = new Date(Date.now() - 30*24*60*60*1000).toISOString();
  try {
    var url = 'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/'
      + MT5_ACCOUNT_ID + '/history-deals/time/'
      + encodeURIComponent(startTime) + '/' + encodeURIComponent(endTime);
    var res = await fetch(url, {headers:{'auth-token':MT5_TOKEN}});
    if(!res.ok) return;
    var data = await res.json();
    if(!Array.isArray(data)) return;
    // 決済deal（DEAL_ENTRY_OUT）のみ
    var closedDeals = data.filter(function(d){
      return d.entryType === 'DEAL_ENTRY_OUT';
    });
    positionHistory = closedDeals.sort(function(a,b){ return new Date(b.time||0) - new Date(a.time||0); })
      .slice(0, 20);
    document.getElementById('histCount').textContent = positionHistory.length + '件';
    tradeMarks = closedDeals;
    if(chartInstance) chartInstance.update('none');
  } catch(e) {}
}

  positionHistory.forEach(function(d){

      var parts = dtRaw.split(' ');
      var datePart = parts[0].slice(5).replace('-','/');
      var timePart = parts[1].slice(0,5);
      timeStr = datePart + ' ' + timePart;

      timeStr = (d2.getUTCMonth()+1).toString().padStart(2,'0') + '/'

        + d2.getUTCHours().toString().padStart(2,'0') + ':'
        + d2.getUTCMinutes().toString().padStart(2,'0');
    } else {
      timeStr = '--';
    }
    var badgeColor = isBuy ? 'var(--green)' : 'var(--red)';
    var badgeText = isBuy ? 'BUY' : 'SELL';

      + '<div class="pos-item-header">'
      + '<div style="display:flex;align-items:center;gap:8px;">'
      + '<span style="font-size:10px;font-weight:700;color:'+badgeColor+';border:1px solid '+badgeColor+';border-radius:4px;padding:2px 6px;">'+badgeText+'</span>'
      + '<span style="font-size:11px;color:var(--muted);">'+timeStr+'</span>'

  });
  el.innerHTML = html;
}

function showTPSLOnChart(idx){
  var p = mt5Positions[idx];
  if(!p || !analysisResult) return;
  var isBuy = (p.type||'').toLowerCase().includes('buy');
  var rawTp = analysisResult.tp, rawSl = analysisResult.sl;
  var tp, sl;
  if(isBuy){
    tp = rawTp > p.openPrice ? rawTp : rawSl > p.openPrice ? rawSl : null;
    sl = rawSl < p.openPrice ? rawSl : rawTp < p.openPrice ? rawTp : null;
  } else {
    tp = rawTp < p.openPrice ? rawTp : rawSl < p.openPrice ? rawSl : null;
    sl = rawSl > p.openPrice ? rawSl : rawTp > p.openPrice ? rawTp : null;
  }
  var pnlJPY = Math.round((p.unrealizedProfit||p.profit||0) * (p.accountCurrencyExchangeRate||1) * USD_JPY);

  // 建値+TP+SLをentryLinesにセット
  entryLines = [{
    price: p.openPrice,
    color: '#ffffff',
    label: (isBuy?'▲ BUY':'▼ SELL')+' '+p.openPrice.toFixed(2),

  if(sl) entryLines.push({price:sl, color:'#ff4d6a', label:'✗ 損切 '+sl.toFixed(2), width:1.5, dash:[6,3]});

function runFallbackAnalysis(){
  if(!chartData.length) return;
  var dow = calcDowTheory(chartData);
  var price = mt5Bid || chartLastClose || chartData[chartData.length-1].c;
  var atr = dow.atr;
  var signal = dow.trend==='上昇トレンド'?'BUY':dow.trend==='下降トレンド'?'SELL':'WAIT';
  var strength = signal==='WAIT'?'弱':'中';
  var r1=dow.resistanceLevels[0]||+(price*1.005).toFixed(2);
  var r2=dow.resistanceLevels[1]||+(price*1.010).toFixed(2);
  var s1=dow.supportLevels[0]||+(price*0.995).toFixed(2);
  var s2=dow.supportLevels[1]||+(price*0.990).toFixed(2);
  var tp=signal==='BUY'?+(price+atr*2).toFixed(2):signal==='SELL'?+(price-atr*2).toFixed(2):+(price+atr*1.5).toFixed(2);
  var sl=signal==='BUY'?+(price-atr*1).toFixed(2):signal==='SELL'?+(price+atr*1).toFixed(2):+(price-atr*1.5).toFixed(2);
  var rrNum=Math.abs(tp-price)/(Math.abs(sl-price)||1);
  var cls=chartData.slice(-20).map(function(c){return c.c;});
  var ma20val=cls.length?(cls.reduce(function(a,b){return a+b;},0)/cls.length).toFixed(2):'--';
  var r={signal:signal,strength:strength,dow_trend:dow.trend,dow_basis:dow.trendDetail,
    entry_reason:['ダウ理論: '+dow.trendDetail,signal==='BUY'?'押し目買い':signal==='SELL'?'戻り売り':'様子見','ATR基準TP/SL'],
    entry:price,tp:tp,sl:sl,rr:'1:'+rrNum.toFixed(1),
    sr:[{label:'R1',price:r1},{label:'R2',price:r2},{label:'S1',price:s1},{label:'S2',price:s2}],
    analysis:dow.trend+'継続。'+dow.trendDetail+'確認。ダウ理論でエントリー検討。',
    warning:'ローカル分析。必ず自己判断でトレードしてください。',
    ma20:ma20val,atr:atr};
  analysisResult=r;
  overlayLines=r.sr.filter(function(l){return l.price>1000&&l.price<100000;}).map(function(s){
    var cm={R1:'#ff4d6a',R2:'#ff8099',S1:'#00d97e',S2:'#66ffbb'};
    return {price:s.price,color:cm[s.label]||'#f0b429',label:s.label,width:1.5,dash:[4,3]};
  });
  buildChart(chartData,overlayLines.concat(entryLines));
  renderAI(r);
}

  var prompt = `あなたはダウ理論に精通したゴールド（XAU/USD）専門トレーダーです。

                 :(dowTrend==='下降トレンド')?'var(--red)':'var(--gold)';
  var reasons   = Array.isArray(r.entry_reason) ? r.entry_reason
                 : (r.reason ? (Array.isArray(r.reason)?r.reason:r.reason.split('\n').filter(Boolean)) : []);
  var warningText = r.warning || r.risk || '';

    + '<div class="signal-sub" style="color:'+dowColor+'">'+dowTrend+'</div>'
    + '</div>'

    + '<div class="analysis-head" style="color:'+dowColor+'">📐 ダウ理論判定</div>'

    + '</div>'
    + '<div style="background:var(--bg);border-radius:8px;padding:10px;">'
    + '<div style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;">判定根拠</div>'

function openPnL(){ document.getElementById('pnlModal').classList.add('show'); }
function closePnL(){ document.getElementById('pnlModal').classList.remove('show'); }
function calcPnL(){
  var dir=document.getElementById('pDir').value;
  var entry=parseFloat(document.getElementById('pEntry').value);
  var exit=parseFloat(document.getElementById('pExit').value);
  var lot=parseFloat(document.getElementById('pLot').value)||0.1;
  var usdjpy=parseFloat(document.getElementById('pUsdJpy').value)||150;
  if(!entry||!exit) return;
  var diff=dir==='buy'?(exit-entry):(entry-exit);
  var pnlJPY=diff*lot*100*usdjpy;
  var isP=pnlJPY>=0;
  var box=document.getElementById('pnlBox');
  box.style.background=isP?'rgba(0,217,126,0.1)':'rgba(255,77,106,0.1)';
  box.style.border='1px solid '+(isP?'var(--green)':'var(--red)');
  document.getElementById('pnlLabel').style.color=isP?'var(--green)':'var(--red)';
  document.getElementById('pnlLabel').textContent=isP?'含み益 / 確定利益':'含み損 / 確定損失';
  document.getElementById('pnlValue').style.color=isP?'var(--green)':'var(--red)';
  document.getElementById('pnlValue').textContent=(isP?'+':'-')+'¥'+Math.abs(Math.round(pnlJPY)).toLocaleString();
  document.getElementById('pnlSub').textContent=(isP?'+':'-')+'$'+Math.abs(diff*lot*100).toFixed(2)+' | '+lot+'lot';
  document.getElementById('pnlResult').style.display='block';
}
function applyEntryLine(){
  var dir=document.getElementById('pDir').value;
  var entry=parseFloat(document.getElementById('pEntry').value);
  var lot=parseFloat(document.getElementById('pLot').value)||0.1;
  var usdjpy=parseFloat(document.getElementById('pUsdJpy').value)||150;
  if(!entry||!chartData.length){alert('エントリー価格を入力してください');return;}
  var price=mt5Bid||chartLastClose||chartData[chartData.length-1].c;
  var diff=dir==='buy'?(price-entry):(entry-price);
  var pnlJPY=Math.round(diff*lot*100*usdjpy);
  var isP=pnlJPY>=0;
  entryLines=[
    {price:entry,color:'#ffffff',label:(dir==='buy'?'BUY':'SELL')+' '+entry.toFixed(2),width:2,dash:[]},
    {price:price,color:isP?'#00d97e':'#ff4d6a',
     label:(isP?'+':'-')+'¥'+Math.abs(pnlJPY).toLocaleString(),width:1.5,dash:[6,3]},
  ];
  if(analysisResult){
    entryLines.push({price:analysisResult.tp,color:'#00d97e',label:'TP '+analysisResult.tp,width:1,dash:[4,3]});
    entryLines.push({price:analysisResult.sl,color:'#ff4d6a',label:'SL '+analysisResult.sl,width:1,dash:[4,3]});
  }
  buildChart(chartData,overlayLines.concat(entryLines));
  closePnL();
}

// ══ TOUCH ZOOM ══
var _rafPending = false;
function scheduleChartUpdate() {
  if(_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(function() {
    _rafPending = false;
    redrawChart();
  });
}
var _tz={isPan:false,lastX:0,pinchDist:0,pinchRange:0,vMin:0,vMax:0};
function initTouchZoom(){
  var c=document.getElementById('mainChart');

  c.addEventListener('touchstart',function(e){
    if(e.touches.length===1){
      _tz.isPan=true; _tz.lastX=e.touches[0].clientX;
      _tz.vMin=_cv.vMin; _tz.vMax=_cv.vMax;
    } else if(e.touches.length===2){
      _tz.isPan=false;
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      _tz.pinchDist=Math.sqrt(dx*dx+dy*dy);
      _tz.vMin=_cv.vMin; _tz.vMax=_cv.vMax;
      _tz.pinchRange=_cv.vMax-_cv.vMin;
    }
    e.preventDefault();
  },{passive:false});

  c.addEventListener('touchmove',function(e){
    if(!_cv.candles.length) return;
    var total=_cv.candles.length;
    if(e.touches.length===1&&_tz.isPan){
      followLatest = false;
      var dx=e.touches[0].clientX-_tz.lastX; _tz.lastX=e.touches[0].clientX;
      var range=_tz.vMax-_tz.vMin;
      var shift=-dx/c.offsetWidth*range;
      _tz.vMin=Math.max(0,_tz.vMin+shift);
      _tz.vMax=Math.min(total-1,_tz.vMax+shift);
      _cv.vMin=_tz.vMin; _cv.vMax=_tz.vMax;
      _fitY(_cv.vMin,_cv.vMax);
      scheduleChartUpdate();
    } else if(e.touches.length===2){
      followLatest = false;
      var dx2=e.touches[0].clientX-e.touches[1].clientX;
      var dy2=e.touches[0].clientY-e.touches[1].clientY;
      var dist=Math.sqrt(dx2*dx2+dy2*dy2);
      var scale=_tz.pinchDist/dist;
      var range=Math.max(5,Math.min(total,_tz.pinchRange*scale));
      var center=(_tz.vMin+_tz.vMax)/2;
      _cv.vMin=Math.max(0,center-range/2);
      _cv.vMax=Math.min(total-1,center+range/2);
      _fitY(_cv.vMin,_cv.vMax);
      scheduleChartUpdate();
    }
    e.preventDefault();
  },{passive:false});

  c.addEventListener('touchend',function(){_tz.isPan=false;});

  // ── ホイールズーム ──
  c.addEventListener('wheel',function(e){
    e.preventDefault();
    if(!_cv.candles.length) return;
    followLatest = false;
    var total=_cv.candles.length;
    var range=_cv.vMax-_cv.vMin;
    var factor=e.deltaY>0?1.15:0.87;
    var newRange=Math.max(5,Math.min(total,range*factor));
    var center=(_cv.vMin+_cv.vMax)/2;
    _cv.vMin=Math.max(0,center-newRange/2);
    _cv.vMax=Math.min(total-1,center+newRange/2);
    _fitY(_cv.vMin,_cv.vMax);
    redrawChart();
  },{passive:false});

  // ── マウスドラッグパン ──
  var _mouse={isDragging:false,startX:0,vMin:0,vMax:0};
  c.addEventListener('mousedown',function(e){
    _mouse.isDragging=true; _mouse.startX=e.clientX;
    _mouse.vMin=_cv.vMin; _mouse.vMax=_cv.vMax;
    c.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',function(e){
    if(!_mouse.isDragging||!_cv.candles.length) return;
    followLatest = false;
    var total=_cv.candles.length;
    var range=_mouse.vMax-_mouse.vMin;
    var shift=-(e.clientX-_mouse.startX)/c.offsetWidth*range;
    _cv.vMin=Math.max(0,_mouse.vMin+shift);
    _cv.vMax=Math.min(total-1,_mouse.vMax+shift);
    _fitY(_cv.vMin,_cv.vMax);
    scheduleChartUpdate();
  });
  window.addEventListener('mouseup',function(){
    _mouse.isDragging=false; c.style.cursor='crosshair';
  });
  c.style.cursor='crosshair';

  // ── ダブルクリック/ダブルタップでリセット ──
  function resetView(){
    if(!_cv.candles.length) return;
    followLatest = true;
    resetViewportToLatest();
    redrawChart();
  }
  c.addEventListener('dblclick',resetView);
  var lastTap=0;
  c.addEventListener('touchend',function(){
    var now=Date.now();
    if(now-lastTap<300) resetView();
    lastTap=now;
  });
}
// ══ TRADE ══
var _trdLot = 0.10;
var _trdSide = null; // 'buy' or 'sell'
var _trdOrderType = 'market'; // 'market' | 'limit' | 'stop'
var _trdPrice = 0;
var _trdAsk = 0;
var _trdBid = 0;

function updateTradePrices(ask, bid){
  _trdAsk = ask; _trdBid = bid;
  var askEl = document.getElementById('trdAskPrice');
  var bidEl = document.getElementById('trdBidPrice');
  if(askEl) askEl.textContent = ask ? ask.toFixed(2) : '---.--';
  if(bidEl) bidEl.textContent = bid ? bid.toFixed(2) : '---.--';
}

function updateCloseButton(positions){
  var btn = document.getElementById('trdCloseBtn');
  if(!btn) return;
  if(positions && positions.length > 0){
    btn.classList.add('show');
    btn.textContent = '全決済(' + positions.length + ')';
  } else {
    btn.classList.remove('show');
  }
}

function openTrdModal(side){
  _trdSide = side;
  _trdOrderType = 'market';
  _trdPrice = side === 'buy' ? (_trdAsk || mt5Bid) : (_trdBid || mt5Bid);
  var lot = parseFloat(document.getElementById('lotInput').value) || 0.01;
  var info = (side === 'buy' ? '▲ BUY' : '▼ SELL') + ' ' + lot.toFixed(2) + ' lot';
  document.getElementById('trdConfirmInfo').textContent = info;
  document.getElementById('trdConfirmPrice').textContent = _trdPrice ? _trdPrice.toFixed(2) : '---.--';
  document.getElementById('trdConfirmPrice').style.color = side === 'buy' ? 'var(--green)' : 'var(--red)';
  // 注文タイプを成行にリセット
  document.querySelectorAll('.trd-type-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelector('.trd-type-btn[data-otype="market"]').classList.add('active');
  document.getElementById('trdLimitWrap').style.display = 'none';
  document.getElementById('trdLimitPrice').value = '';
  document.getElementById('trdLimitPrice').placeholder = _trdPrice ? _trdPrice.toFixed(2) : '---.--';
  // TP/SL: AI分析結果があれば自動入力、なければ空欄
  var tpEl = document.getElementById('trdTpInput');
  var slEl = document.getElementById('trdSlInput');
  document.getElementById('trdTpslErr').style.display = 'none';
  if(analysisResult && _trdPrice > 0){
    var r = analysisResult;
    if(side === 'buy'){
      tpEl.value = r.tp > _trdPrice ? r.tp : (r.sl > _trdPrice ? r.sl : '');
      slEl.value = r.sl < _trdPrice ? r.sl : (r.tp < _trdPrice ? r.tp : '');
    } else {
      tpEl.value = r.tp < _trdPrice ? r.tp : (r.sl < _trdPrice ? r.sl : '');
      slEl.value = r.sl > _trdPrice ? r.sl : (r.tp > _trdPrice ? r.tp : '');
    }
  } else {
    tpEl.value = ''; slEl.value = '';
  }
  document.getElementById('trdOverlay').classList.add('show');
}

function closeTrdOverlay(){
  document.getElementById('trdOverlay').classList.remove('show');
}

function showTrdToast(msg, color){
  var el = document.getElementById('trdToast');
  el.textContent = msg;
  el.style.borderColor = color || 'var(--border)';
  el.style.color = color || 'var(--text)';
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 3000);
}

async function executeTrade(side, lot, price){
  if(!MT5_TOKEN || !MT5_ACCOUNT_ID){
    showTrdToast('MT5未接続です', 'var(--red)'); return;
  }
  // 楽観的UI更新（レスポンスを待たずに即時反映）
  var curCount = mt5Positions.length;
  document.getElementById('posCount').textContent = (curCount + 1) + '件';
  document.getElementById('pnlVal').textContent = '計算中...';
  document.getElementById('pnlVal').style.color = 'var(--muted)';

  var actionTypeMap = {
    'market': 'ORDER_TYPE_' + side.toUpperCase(),
    'limit':  'ORDER_TYPE_' + side.toUpperCase() + '_LIMIT',
    'stop':   'ORDER_TYPE_' + side.toUpperCase() + '_STOP'
  };
  var body = {
    actionType: actionTypeMap[_trdOrderType] || ('ORDER_TYPE_' + side.toUpperCase()),
    symbol: 'XAUUSDs',
    volume: lot,
    comment: 'GoldCopilot'
  };
  if(_trdOrderType !== 'market'){
    var limitPrice = parseFloat(document.getElementById('trdLimitPrice').value);
    if(!isNaN(limitPrice) && limitPrice > 0) body.openPrice = limitPrice;
  }
  var tpVal = parseFloat(document.getElementById('trdTpInput').value);
  var slVal = parseFloat(document.getElementById('trdSlInput').value);
  if(!isNaN(tpVal) && tpVal > 0) body.takeProfit = tpVal;
  if(!isNaN(slVal) && slVal > 0) body.stopLoss = slVal;
  try {
    var res = await fetch(
      'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/' + MT5_ACCOUNT_ID + '/trade',
      {
        method: 'POST',
        headers: {'auth-token': MT5_TOKEN, 'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      }
    );
    if(res.ok){
      var data = await res.json();
      if(data.numericCode === 10009 || data.stringCode === 'TRADE_RETCODE_DONE'){
        showTrdToast((side === 'buy' ? '▲ BUY' : '▼ SELL') + ' ' + lot + 'lot — 注文成功', side === 'buy' ? 'var(--green)' : 'var(--red)');
        setTimeout(fetchMT5Data, 500);
      } else {
        showTrdToast('注文失敗: ' + (data.stringCode || data.numericCode || 'ERROR'), 'var(--red)');
      }
    } else {
      showTrdToast('注文失敗 (HTTP ' + res.status + ')', 'var(--red)');
    }
  } catch(e){
    showTrdToast('通信エラー: ' + e.message, 'var(--red)');
  }
}

async function closeAllPositions(){
  if(!MT5_TOKEN || !MT5_ACCOUNT_ID){
    showTrdToast('MT5未接続です', 'var(--red)'); return;
  }
  if(!mt5Positions.length){ showTrdToast('決済するポジションがありません', 'var(--muted)'); return; }
  var count = mt5Positions.length;
  // 楽観的UI更新（レスポンスを待たずに即時反映）
  document.getElementById('posCount').textContent = '0件';
  var pnlEl = document.getElementById('pnlVal');
  pnlEl.textContent = '+¥0'; pnlEl.style.color = 'var(--green)';
  entryLines = [];
  if(chartData.length) buildChart(chartData, overlayLines);

  try {
    var promises = mt5Positions.map(function(p){
      return fetch(
        'https://mt-client-api-v1.london.agiliumtrade.ai/users/current/accounts/' + MT5_ACCOUNT_ID + '/trade',
        {
          method: 'POST',
          headers: {'auth-token': MT5_TOKEN, 'Content-Type': 'application/json'},
          body: JSON.stringify({actionType: 'POSITION_CLOSE_ID', positionId: p.id})
        }
      );
    });
    await Promise.all(promises);
    showTrdToast(count + '件のポジションを決済しました', 'var(--gold)');
    setTimeout(fetchMT5Data, 500);
  } catch(e){
    showTrdToast('決済エラー: ' + e.message, 'var(--red)');
  }
}

window.addEventListener('DOMContentLoaded', function(){
  // LOTプリセットボタン
  document.querySelectorAll('.lot-preset').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.lot-preset').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('lotInput').value = parseFloat(btn.dataset.lot).toFixed(2);
      updateMarginInfo();

  });
  // LOT手動入力
  document.getElementById('lotInput').addEventListener('change', function(){

    if(!isNaN(v) && v > 0){
      this.value = (Math.round(v * 100) / 100).toFixed(2);
      document.querySelectorAll('.lot-preset').forEach(function(b){ b.classList.remove('active'); });
    }
    updateMarginInfo();
  });
  // BUYボタン
  document.getElementById('trdBuyBtn').addEventListener('click', function(){
    openTrdModal('buy');
  });
  // SELLボタン
  document.getElementById('trdSellBtn').addEventListener('click', function(){
    openTrdModal('sell');
  });
  // 全決済ボタン
  document.getElementById('trdCloseBtn').addEventListener('click', function(){
    if(confirm('全ポジションを決済しますか？')) closeAllPositions();
  });
  // 注文タイプタブ
  document.querySelectorAll('.trd-type-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.trd-type-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      _trdOrderType = btn.dataset.otype;
      var wrap = document.getElementById('trdLimitWrap');
      if(_trdOrderType === 'market'){
        wrap.style.display = 'none';
      } else {
        wrap.style.display = 'block';
        document.getElementById('trdLimitPrice').placeholder = _trdPrice ? _trdPrice.toFixed(2) : '---.--';
      }
      document.getElementById('trdTpslErr').style.display = 'none';
    });
  });
  // 注文確定ボタン
  document.getElementById('trdConfirmOk').addEventListener('click', function(){
    var lot = parseFloat(document.getElementById('lotInput').value) || 0.01;
    var tp = parseFloat(document.getElementById('trdTpInput').value);
    var sl = parseFloat(document.getElementById('trdSlInput').value);
    var errEl = document.getElementById('trdTpslErr');
    // 指値/逆指値バリデーション
    if(_trdOrderType !== 'market'){
      var lp = parseFloat(document.getElementById('trdLimitPrice').value);
      if(isNaN(lp) || lp <= 0){
        errEl.textContent = '注文価格を入力してください'; errEl.style.display = 'block'; return;
      }
      if(_trdOrderType === 'limit'){
        if(_trdSide === 'buy' && lp >= _trdPrice){
          errEl.textContent = '指値BUYは現在価格より低い価格を入力してください'; errEl.style.display = 'block'; return;
        }
        if(_trdSide === 'sell' && lp <= _trdPrice){
          errEl.textContent = '指値SELLは現在価格より高い価格を入力してください'; errEl.style.display = 'block'; return;
        }
      }
    }
    // TP/SLバリデーション
    if(!isNaN(tp) && !isNaN(sl) && tp > 0 && sl > 0){
      if(_trdSide === 'buy' && tp <= sl){
        errEl.textContent = 'BUYはTP > SLにしてください'; errEl.style.display = 'block'; return;
      }
      if(_trdSide === 'sell' && tp >= sl){
        errEl.textContent = 'SELLはTP < SLにしてください'; errEl.style.display = 'block'; return;
      }
    }
    errEl.style.display = 'none';
    closeTrdOverlay();
    executeTrade(_trdSide, lot, _trdPrice);
  });
  // オーバーレイ外タップで閉じる
  document.getElementById('trdOverlay').addEventListener('click', function(e){
    if(e.target === this) closeTrdOverlay();
  });
});

// ══ ダウ理論計算 ══

function calcATR(candles, period) {
  period = period || 14;
  if(!candles || candles.length < period + 1) return 5;
  var trs = [];
  for(var i = 1; i < candles.length; i++){
    var hl = candles[i].h - candles[i].l;
    var hpc = Math.abs(candles[i].h - candles[i-1].c);
    var lpc = Math.abs(candles[i].l - candles[i-1].c);
    trs.push(Math.max(hl, hpc, lpc));
  }
  var recent = trs.slice(-period);
  return recent.reduce(function(a,b){return a+b;},0) / recent.length;
}

function calcDowTheory(candles) {
  if(!candles || candles.length < 10) {
    return {trend:'判定中', trendDetail:'データ不足', trendColor:'var(--muted)',
      swingHighs:[], swingLows:[], recentHighs:[], recentLows:[],
      resistanceLevels:[], supportLevels:[], atr:5};
  }
  var n = 3;
  var swingHighs = [], swingLows = [];
  for(var si = n; si < candles.length - n; si++){
    var isHigh = true, isLow = true;
    for(var j = 1; j <= n; j++){
      if(candles[si].h <= candles[si-j].h || candles[si].h <= candles[si+j].h) isHigh = false;
      if(candles[si].l >= candles[si-j].l || candles[si].l >= candles[si+j].l) isLow  = false;
    }
    if(isHigh) swingHighs.push({idx:si, price:candles[si].h, t:candles[si].t});
    if(isLow)  swingLows.push( {idx:si, price:candles[si].l, t:candles[si].t});
  }
  var recentHighs = swingHighs.slice(-4);
  var recentLows  = swingLows.slice(-4);

  var hhCount=0, hlCount=0, lhCount=0, llCount=0;
  for(var hi=1; hi<recentHighs.length; hi++){
    if(recentHighs[hi].price > recentHighs[hi-1].price) hhCount++; else lhCount++;
  }
  for(var li=1; li<recentLows.length; li++){
    if(recentLows[li].price > recentLows[li-1].price) hlCount++; else llCount++;
  }

  var trend, trendDetail, trendColor;
  if(hhCount > 0 && hlCount > 0 && lhCount === 0 && llCount === 0){
    trend='上昇トレンド'; trendDetail='HH + HL 確認'; trendColor='var(--green)';
  } else if(lhCount > 0 && llCount > 0 && hhCount === 0 && hlCount === 0){
    trend='下降トレンド'; trendDetail='LH + LL 確認'; trendColor='var(--red)';
  } else if(hhCount > lhCount && hlCount > llCount){
    trend='上昇トレンド'; trendDetail='HH+HL 優勢'; trendColor='var(--green)';
  } else if(lhCount > hhCount && llCount > hlCount){
    trend='下降トレンド'; trendDetail='LH+LL 優勢'; trendColor='var(--red)';
  } else if(hhCount > 0 && llCount > 0){
    trend='転換疑い'; trendDetail='HH+LL 混在'; trendColor='var(--gold)';
  } else {
    trend='レンジ相場'; trendDetail='方向感なし'; trendColor='var(--gold)';
  }

  var atr = calcATR(candles, 14);
  var resistanceLevels = recentHighs.map(function(s){return s.price;})
    .sort(function(a,b){return b-a;}).slice(0,3);
  var supportLevels = recentLows.map(function(s){return s.price;})
    .sort(function(a,b){return a-b;}).slice(0,3);

  return {
    trend:trend, trendDetail:trendDetail, trendColor:trendColor,
    swingHighs:swingHighs, swingLows:swingLows,
    recentHighs:recentHighs, recentLows:recentLows,
    resistanceLevels:resistanceLevels, supportLevels:supportLevels,
    atr:atr
  };
}
